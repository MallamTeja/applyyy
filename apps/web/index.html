<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Dense operator tables must be readable on a laptop screen without the
         mobile browser zooming them into unreadability. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- The product is applyy with two y's. The repo, folder and Vercel project
         still read applyyy pending a rename Teja does himself; nothing
         user-visible is allowed to carry the typo. -->
    <title>applyy — application console</title>

    <!-- This console holds CTC, personal answers and a full resume. Search
         engines must never index a deployed preview URL. -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- An inline SVG data URI rather than a favicon.ico file. Browsers request
         /favicon.ico unprompted, and without this the console logs a 404 on
         every single page load - which is exactly the kind of harmless noise
         that trains you to ignore the console, and this app relies on the
         console being worth reading. A data URI also needs no extra request. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%231b211f'/%3E%3Cpath d='M4.4 11.6 8 4.4l3.6 7.2' stroke='%23f6efe9' stroke-width='1.6' fill='none' stroke-linejoin='round'/%3E%3C/svg%3E"
    />

    <!-- Theme bootstrap. Deliberately inline, blocking, and above the
         stylesheet, because it has to finish before the first paint.

         WHY IT CANNOT LIVE IN THE REACT APP: the app is a module, so it runs
         after the document is parsed and painted. An operator who chose Dark
         on a light-mode machine would get one frame of white console before
         React mounted - a flash bright enough to be unpleasant in a dark room
         on every navigation-free reload.

         WHY IT DUPLICATES TWO STRINGS from src/app/theme.ts: a blocking
         inline script cannot import a module. The key and attribute names are
         repeated there with a matching warning. Missing one shows up as a
         one-frame flash, which is easy to mistake for imagination.

         Only "light" and "dark" are honoured. Anything else - absent, stale
         from an older build, or corrupt - leaves the attribute off, which is
         what makes the console follow the operating system by default. -->
    <script>
      try {
        var storedTheme = localStorage.getItem('applyy.theme');
        if (storedTheme === 'light' || storedTheme === 'dark') {
          document.documentElement.setAttribute('data-theme', storedTheme);
        }
      } catch (storageBlocked) {
        /* Reading localStorage throws outright when the browser blocks site
           data. The console must still start; it just opens in the OS theme. */
      }
    </script>

    <!-- Three faces with distinct jobs: Inter for machine chrome, IBM Plex Serif
         for resume prose (it is a document, so it is set like one), IBM Plex Mono
         only for literal identifiers a human might copy. They are SELF-HOSTED
         since 2026-11-09: the @font-face rules live in src/styles/tokens.css and
         the files in public/fonts. Until then a render-blocking third-party
         stylesheet sat here, before the module script, so the app's JS on every
         page waited one extra round trip for it (~180 ms measured). Nothing on
         this page may load from another origin: the CSP (vercel.json) allows
         fonts from 'self' only. -->
    <!-- Preload ONLY the face the first paint needs most: Inter latin, the body
         text of every page. The browser would otherwise discover it only after
         the CSS bundle is parsed. crossorigin is required for a font preload,
         even same-origin, or the browser downloads the file twice. -->
    <link rel="preload" href="/fonts/Inter-400-700-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <!-- Single mount point; the shell and router take over from main.tsx. -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
