# =============================================================================
# applyy — Supabase LOCAL development configuration.
#
# THIS FILE CONFIGURES THE LOCAL STACK ONLY. It does not touch the hosted project
# (ref xynqxekcqizwhtskzqrq, ap-southeast-2). Nothing here is applied to the remote
# database, and nothing in this repo should apply anything to it: `supabase link`
# and `supabase db push` are gated on Teja's explicit approval, because a schema
# push is a state change to real infrastructure.
#
# What this file IS for: `supabase start` + `supabase db reset` to prove the
# migrations apply cleanly, in order, against the same Postgres major version the
# hosted project runs. That is the only validation available without a push.
# =============================================================================

# Namespaces the local containers. Kept as the folder name rather than the product
# name on purpose — this string identifies a Docker project on this machine, not the
# product, and changing it orphans running containers.
project_id = "applyyy"

[api]
enabled = true
# The port supabase-js points at locally.
port = 54321
# Schemas PostgREST exposes. `public` only: applyy_internal holds the trigger
# functions and MUST NOT be reachable over the API, which is the entire reason it
# exists as a separate schema.
schemas = ["public"]
# Schemas searched when resolving unqualified names in a request.
extra_search_path = ["public", "extensions"]
# Cap on rows returned by an unbounded request, so a mistaken `select *` on jobs
# cannot pull the whole table into a browser tab.
max_rows = 1000

[db]
port = 54322
# Local shadow database used to diff migrations.
shadow_port = 54320
# MUST MATCH THE HOSTED PROJECT: Postgres 17. Validating against a different major
# version would prove the migrations apply to a database we do not run — and
# generated columns, enum handling and `ALTER TYPE` behaviour all differ across
# majors, so the mismatch would be invisible until the push.
major_version = 17

[db.pooler]
# Off locally. The pooler matters in production (it is why every `set_config` in the
# migrations passes `is_local => true`, so a setting cannot leak between transactions
# on a shared connection), but locally it only adds a moving part to debug.
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
# Local mail catcher. Auth emails land here instead of being sent, which is what makes
# it safe to exercise signup flows without mailing a real address.
enabled = true
port = 54324

[storage]
enabled = true
# Resume PDFs and blocked-page screenshots. 50 MiB is far above a resume and far below
# anything that would fill a disk by accident.
file_size_limit = "50MiB"

[auth]
enabled = true
# The URL the local frontend runs on; auth redirects come back here.
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
# One hour. Short enough that a leaked token expires quickly, long enough to
# outlast a worker run — but the margin is now much thinner than it looks, and
# the reason is worth recording where the number lives.
#
# This comment used to read "~90s per application". That figure is wrong: a
# single in-process application measured ~3.75s against a localhost fixture.
# The real cost is per-RUN, not per-application (~40-70s of runner startup,
# checkout and browser install), and GitHub bills every job rounded UP to a
# whole minute, which is why the worker batches all of a day's applications
# into ONE run instead of taking one run each.
#
# CORRECTION, recorded rather than quietly replaced. An earlier version of this
# comment claimed batching left only ~10% headroom (~3240s against 3600s). That
# was wrong by a factor of about 25, and the way it was wrong is the instructive
# part: it was derived from PROJECT_PLAN §2's "~54 min/day" table cell, which was
# itself 35 x 90s — the per-application estimate that the same section had
# already refuted three lines earlier. A stale DERIVED figure survived a
# correction to the figure it was derived from, and then looked reviewed.
#
# Measured reality, ten applications through the real loop (real Chromium, real
# captured Greenhouse DOM, full-page screenshot, dry-run): 1407 ms per
# application amortised. So ~35/day is ~49 SECONDS of work, one batched run is
# ~2 min of billed time, and the headroom against a 3600s token is ~97%.
#
# So mid-run expiry is NOT the near-certain failure it briefly appeared to be.
# The worker still refreshes proactively before each application rather than
# reactively on a 401, and that remains correct — but as INSURANCE against an
# unmeasured risk, not as a fix for an imminent one: the measurement above runs
# against a localhost fixture and excludes real-site latency, TLS and resume PDF
# upload, so the true per-application cost is higher and unmeasured. Proactive is
# preferred over reactive because a 401 caught at the wrong moment is
# indistinguishable from the dangerous case.
#
# Raising this value would be the wrong fix regardless of magnitude: it trades a
# bounded, testable refresh path for a longer-lived credential sitting in a
# GitHub Actions runner. The refresh-token rotation below is what supports the
# refresh path.
jwt_expiry = 3600
# The worker signs in once per run and relies on the access token; rotation protects
# the long-lived refresh token it holds in Actions secrets.
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Single-user system. Nobody else should be able to create an account against the
# local stack either — keeping this false locally means the local database matches
# the hosted one's intent rather than being quietly more permissive.
enable_signup = false

[auth.email]
enable_signup = false
# No confirmation step locally: there is no real mailbox, and Inbucket already
# captures anything sent.
enable_confirmations = false

[analytics]
# Off. It is a heavy container and this project has no use for it.
enabled = false

# ---------------------------------------------------------------------------
# Edge Function overrides.
# ---------------------------------------------------------------------------

# The Apps Script email tracker posts here, and Apps Script CANNOT mint a
# Supabase JWT — it has no access to the project's signing secret and no
# Supabase client. With the default verify_jwt = true the platform rejects every
# request at the gateway BEFORE the function body runs, so no amount of
# in-function logic can rescue it; the function would be unreachable by its only
# caller.
[functions.email-tracker-intake]
# Disables gateway JWT verification for this ONE function. Scoped per-function
# on purpose: it is the narrowest place the exemption can live, so no other
# function silently inherits an open door.
#
# This does NOT make the endpoint unauthenticated — it moves authentication from
# the gateway into the function, which must therefore verify a shared secret it
# checks itself. An unauthenticated public writer into the tracking tables would
# let anyone forge application-status emails, which is constraint #11 territory.
# applyyy-f8 owns supabase/functions/** and owns that in-function check; this
# file only opens the gate it has to check behind.
verify_jwt = false

# ---------------------------------------------------------------------------
# Every other function, pinned explicitly (added 2026-10-05).
#
# Why pin at all: `supabase functions deploy` applies THIS file. A function with
# no entry here deploys with the default verify_jwt = true, so a routine deploy
# would silently flip any function whose LIVE setting is false. Before this
# block only email-tracker-intake had an entry, so the first CLI deploy of the
# 2026-10-04 fixes would have changed four functions' gateway behaviour as a
# side effect nobody asked for. Each value below is the live value as read by
# session applyyy-cc on 2026-10-05 via the Supabase MCP (not re-read by the
# author of this block), so a deploy changes code, not posture.
#
# Why false is not "open": since a12bce3 / ef9cc6e every pipeline function
# calls authorizeCaller() (_shared/db/gates.ts), which verifies the bearer token
# in-function and refuses anyone but the app user. Gateway verification is a
# second, redundant layer for those; the in-function check is the control.
# ---------------------------------------------------------------------------

# Live = false. Kept: the in-function authorizeCaller() is the control here.
[functions.normalizer]
# Matches live; flipping it is a separate, deliberate decision, not a deploy side effect.
verify_jwt = false

# Live = false. Kept for the same reason as normalizer.
[functions.screener]
# Matches live; in-function authorizeCaller() still rejects non-app-user callers.
verify_jwt = false

# Live = false. Kept for the same reason as normalizer.
[functions.auditor]
# Matches live; in-function authorizeCaller() still rejects non-app-user callers.
verify_jwt = false

# Live = false. The browser invokes it from discoveryService.ts; in-function
# authorizeCaller() (ef9cc6e) is what restricts it to the app user.
[functions.scout-ats]
# Matches live; changing it is a posture decision, not a deploy side effect.
verify_jwt = false

# Live = true. Browser-invoked with the user's session token via functions.invoke.
[functions.matcher]
# Gateway verification plus in-function authorizeCaller(): two layers, both kept.
verify_jwt = true

# Live = true. Browser-invoked via the pipeline runner.
[functions.tailor]
# Matches live; the gateway rejects tokenless calls before any Gemini spend.
verify_jwt = true

# Live = true. Browser-invoked; spends Gemini quota per row.
[functions.follow-up]
# Matches live; a tokenless caller must never reach the Gemini call.
verify_jwt = true

# Live = true. Spends Gemini quota per row.
[functions.cover-letter]
# Matches live; gateway check keeps anonymous callers off the quota.
verify_jwt = true

# Live = true. Spends Gemini quota; ?force no longer bypasses the kill switch (ba401be).
[functions.interview-prep]
# Matches live; gateway plus in-function authorizeCaller().
verify_jwt = true

# Live = true. Spends Gemini quota and writes append-only application_events.
[functions.referral]
# Matches live; an anonymous writer into an undeletable table must be stopped at the gate.
verify_jwt = true

# Live = true. Spends Gemini quota per run.
[functions.skill-gap]
# Matches live; gateway check keeps anonymous callers off the quota.
verify_jwt = true

# Live = true. Seeds and deletes test rows to prove RLS; must never be anonymous.
[functions.rls-proof]
# Matches live; a tokenless caller must not be able to trigger seeding.
verify_jwt = true

# New function (a0149bb), not yet deployed, so there is no live value to match.
# The browser calls it through functions.invoke('scout-web') from WebScoutPanel,
# which always sends the signed-in user's JWT, and it spends Gemini search-grounding
# quota — so there is no legitimate tokenless caller and every reason to refuse one.
[functions.scout-web]
# True: the gateway rejects anonymous calls before any quota is spent.
verify_jwt = true

# New function (2026-10-31): the AI box on the review page proposes resume edits.
# The browser calls it through functions.invoke('resume-assist') with the signed-in
# user's JWT, and every call spends Gemini quota, so no tokenless caller is legitimate.
[functions.resume-assist]
# True: the gateway rejects anonymous calls before any quota is spent.
verify_jwt = true

# New function (2026-10-31), not yet deployed, so there is no live value to match.
# The browser calls it through functions.invoke('job-link-intake') from AddJobLinkPanel with the
# signed-in user's JWT; it fetches arbitrary pasted links and spends Gemini quota, so a
# tokenless caller must be refused at the gateway before either happens.
[functions.job-link-intake]
# True: the gateway rejects anonymous calls; authorizeCaller() inside is the second layer.
verify_jwt = true
