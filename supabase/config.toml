# =============================================================================
# applyy — Supabase LOCAL development configuration.
#
# THIS FILE CONFIGURES THE LOCAL STACK ONLY. It does not touch the hosted project
# (ref xynqxekcqizwhtskzqrq, ap-southeast-2). Nothing here is applied to the remote
# database, and nothing in this repo should apply anything to it: `supabase link`
# and `supabase db push` are gated on Teja's explicit approval, because a schema
# push is a state change to real infrastructure.
#
# What this file IS for: `supabase start` + `supabase db reset` to prove the
# migrations apply cleanly, in order, against the same Postgres major version the
# hosted project runs. That is the only validation available without a push.
# =============================================================================

# Namespaces the local containers. Kept as the folder name rather than the product
# name on purpose — this string identifies a Docker project on this machine, not the
# product, and changing it orphans running containers.
project_id = "applyyy"

[api]
enabled = true
# The port supabase-js points at locally.
port = 54321
# Schemas PostgREST exposes. `public` only: applyy_internal holds the trigger
# functions and MUST NOT be reachable over the API, which is the entire reason it
# exists as a separate schema.
schemas = ["public"]
# Schemas searched when resolving unqualified names in a request.
extra_search_path = ["public", "extensions"]
# Cap on rows returned by an unbounded request, so a mistaken `select *` on jobs
# cannot pull the whole table into a browser tab.
max_rows = 1000

[db]
port = 54322
# Local shadow database used to diff migrations.
shadow_port = 54320
# MUST MATCH THE HOSTED PROJECT: Postgres 17. Validating against a different major
# version would prove the migrations apply to a database we do not run — and
# generated columns, enum handling and `ALTER TYPE` behaviour all differ across
# majors, so the mismatch would be invisible until the push.
major_version = 17

[db.pooler]
# Off locally. The pooler matters in production (it is why every `set_config` in the
# migrations passes `is_local => true`, so a setting cannot leak between transactions
# on a shared connection), but locally it only adds a moving part to debug.
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
# Local mail catcher. Auth emails land here instead of being sent, which is what makes
# it safe to exercise signup flows without mailing a real address.
enabled = true
port = 54324

[storage]
enabled = true
# Resume PDFs and blocked-page screenshots. 50 MiB is far above a resume and far below
# anything that would fill a disk by accident.
file_size_limit = "50MiB"

[auth]
enabled = true
# The URL the local frontend runs on; auth redirects come back here.
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
# One hour. Short enough that a leaked token expires quickly, long enough that a
# GitHub Actions worker run (~90s per application) never expires mid-run.
jwt_expiry = 3600
# The worker signs in once per run and relies on the access token; rotation protects
# the long-lived refresh token it holds in Actions secrets.
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Single-user system. Nobody else should be able to create an account against the
# local stack either — keeping this false locally means the local database matches
# the hosted one's intent rather than being quietly more permissive.
enable_signup = false

[auth.email]
enable_signup = false
# No confirmation step locally: there is no real mailbox, and Inbucket already
# captures anything sent.
enable_confirmations = false

[analytics]
# Off. It is a heavy container and this project has no use for it.
enabled = false
