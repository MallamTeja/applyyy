# The no-description cron (S8, 2026-11-21). Teja, 2026-11-21 14:41 IST: "no-description jobs: Playwright
# confirm + read JD + tailor straight into the approval queue, on a cron." It calls the jd-refetch edge
# function once per row: provider-API liveness, a robots-gated page read with the Vercel browser render as
# fallback, write description_raw, re-screen with the matcher's own gate, then matcher -> tailor -> auditor
# to awaiting_approval (supabase/functions/jd-refetch/handler.ts has the whole flow and why).
# This is the ONE exception to the 2026-11-18 21:45 rule that scouted rows stop at Ready to tailor; every
# other scouted row still stops there.
#
# No actions are used (no checkout, no setup-node): the runner's own Node runs the inline script, so there
# is nothing to pin. Secrets are the same four postscreen-drain.yml and jobs-tombstone.yml use.
name: applyy jd refetch (no-description jobs)

on:
  schedule:
    # Daily at 05:07 UTC = 10:37 IST, after the morning scouts, so their thin rows are in the queue.
    # GitHub cron is best-effort; real start times run hours late (repo CLAUDE.md §4).
    - cron: '7 5 * * *'
  workflow_dispatch:
    inputs:
      max_rows:
        description: 'Rows to try this run (1-30)'
        required: false
        default: '30'

# Read-only token: the script talks only to Supabase, with the app user's session.
permissions:
  contents: read

# One run at a time; an overlapping run waits instead of racing for the same rows.
concurrency:
  group: applyy-jd-refetch
  cancel-in-progress: false

jobs:
  refetch:
    runs-on: ubuntu-latest
    # 30 rows x (up to ~75 s per call + 45 s Gemini pacing after a pipeline start) is ~60 min; 75 is the backstop.
    timeout-minutes: 75
    steps:
      - name: Re-fetch no-description jobs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          APPLYY_APP_USER_EMAIL: ${{ secrets.APPLYY_APP_USER_EMAIL }}
          APPLYY_APP_USER_PASSWORD: ${{ secrets.APPLYY_APP_USER_PASSWORD }}
          # Empty on a schedule; the script defaults it.
          MAX_ROWS: ${{ inputs.max_rows }}
        run: |
          node --input-type=module <<'EOF'
          // A missing secret stops the run loudly instead of signing in as nobody.
          const required = (name) => { const v = (process.env[name] ?? '').trim(); if (v === '') { console.log(`::error::${name} is not set`); process.exit(1); } return v; };
          // The project and its public key.
          const base = required('SUPABASE_URL').replace(/\/+$/, '');
          const anonKey = required('SUPABASE_ANON_KEY');
          // The app user the edge function requires as caller.
          const email = required('APPLYY_APP_USER_EMAIL');
          const password = required('APPLYY_APP_USER_PASSWORD');
          // The per-run cap: a whole number 1-30; anything else is refused, never read as a default.
          const rawMax = (process.env.MAX_ROWS ?? '').trim() || '30';
          const maxRows = /^\d+$/.test(rawMax) ? Number(rawMax) : NaN;
          if (!(maxRows >= 1 && maxRows <= 30)) { console.log(`::error::max_rows must be 1-30, got ${rawMax}`); process.exit(1); }
          // The seven outcome kinds handler.ts returns, plus 'none'. An unknown kind is a contract break.
          const KINDS = new Set(['closed', 'retry_later', 'still_thin', 'dropped', 'pipeline_started', 'skipped_stale', 'error', 'none']);
          // A fresh session per call: a run can outlive a one-hour token.
          async function signIn() {
            const res = await fetch(`${base}/auth/v1/token?grant_type=password`, { method: 'POST', headers: { apikey: anonKey, 'content-type': 'application/json' }, body: JSON.stringify({ email, password }) });
            const body = await res.json().catch(() => null);
            const token = typeof body?.access_token === 'string' ? body.access_token : '';
            if (res.status !== 200 || token === '') { console.log(`::error::sign-in failed: HTTP ${res.status}`); process.exit(1); }
            return token;
          }
          // Gemini pacing after a pipeline start (matcher + tailor + auditor all call Gemini): 45 s, the
          // RPM window measured 2026-11-01.
          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
          // The ids tried this run, sent back so the function moves on to the next row.
          const tried = [];
          // Per-kind counts for the summary.
          const counts = Object.fromEntries([...KINDS].map((k) => [k, 0]));
          for (let i = 0; i < maxRows; i += 1) {
            const token = await signIn();
            const res = await fetch(`${base}/functions/v1/jd-refetch`, { method: 'POST', headers: { apikey: anonKey, authorization: `Bearer ${token}`, 'content-type': 'application/json' }, body: JSON.stringify({ skip_ids: tried }) });
            const text = await res.text();
            // A non-200 is the function failing as a whole: stop red.
            if (res.status !== 200) { console.log(`::error::jd-refetch HTTP ${res.status}: ${text.slice(0, 300)}`); process.exit(1); }
            let body;
            try { body = JSON.parse(text); } catch { console.log(`::error::non-JSON body: ${text.slice(0, 300)}`); process.exit(1); }
            // Shape check: status ok, a known kind, an id or null.
            const kind = body?.outcome?.kind;
            if (body?.status !== 'ok' || !KINDS.has(kind) || !(body.application_id === null || typeof body.application_id === 'string')) { console.log(`::error::unexpected shape: ${text.slice(0, 300)}`); process.exit(1); }
            counts[kind] += 1;
            console.log(`${body.application_id ?? '-'} ${kind} ${JSON.stringify(body.outcome)}`);
            // Nothing thin left.
            if (kind === 'none') break;
            if (kind === 'error') console.log(`::warning::row ${body.application_id}: ${body.outcome.message}`);
            tried.push(body.application_id);
            // Pace only after Gemini work started.
            if (kind === 'pipeline_started') await sleep(45_000);
          }
          console.log(`summary: ${JSON.stringify(counts)}`);
          // Row errors make the run red, so they are seen; every other kind is a normal day.
          if (counts.error > 0) process.exit(1);
          EOF
