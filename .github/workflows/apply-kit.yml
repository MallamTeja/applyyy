name: applyy apply kit (automatic sweep, or one application)

# Builds MANUAL APPLY KITS (worker/src/apply-kit.ts): for each application, opens its live
# form, plans every field from our data, renders a fresh resume with the latest master's
# identity, and appends ONE application_events note the dashboard shows.
# It never claims, moves, fills or submits a row. Greenhouse's reCAPTCHA refuses CI
# SUBMITS (2026-10-24, captcha-failed); loading a form from CI is fine, which is all
# this does. The robots gate still applies (worker/src/apply-one.ts createRobotsCheck).
#
# AUTOMATIC by default (Teja, 2026-10-24: kits are made by the system, not dispatched by
# hand). With no application_id it SWEEPS (worker/src/apply-kit-sweep.ts): every row
# waiting on Teja whose kit is missing or older than its last status change, in batches of 25.
#
# NO THROUGHPUT CAP (Teja 14:47 / approved 14:49, 2026-11-05: "they must run every time a job is in
# the queue"). dispatch-apply starts this on EVERY approve. A run builds up to 25 kits and stops
# starting new ones after 3000 s (run-window.ts), so the 60-minute kill never lands mid-row; if due
# rows were left untried it dispatches itself again (the last step). Safety is unchanged: the kill
# switch, the robots gate, no status writes, and the concurrency group below.
on:
  # Minutes after every applier run, since that is when rows get parked for Teja.
  workflow_run:
    # Must match apply.yml's `name:` exactly; GitHub matches workflow_run by name.
    workflows: ['applyy applier (daily batch)']
    # Any conclusion: a run that ended red may still have parked rows.
    types: [completed]
  # The daily backstop, for rows parked by anything other than an applier run
  # (a sweeper move, a manual status change). 12:00 UTC = 17:30 IST, after the applier's slot.
  schedule:
    - cron: '0 12 * * *'
  # By hand, by dispatch-apply on every approve, or by this workflow's own re-dispatch: blank for a
  # sweep now, or one id to rebuild that row's kit.
  workflow_dispatch:
    inputs:
      # Optional: blank runs the sweep.
      application_id:
        # Shown in the dispatch form, with the statuses the worker accepts.
        description: 'Blank = sweep every row that needs a kit. Or one application UUID (status approved, applying, needs_verification or blocked_needs_human).'
        # Optional, so a blank dispatch sweeps; a malformed id is still refused by the worker.
        required: false
        default: ''

# Read-only on the repository; every write the kit makes goes to Supabase under RLS.
permissions:
  contents: read
  # Only for the self re-dispatch step (gh workflow run); a GITHUB_TOKEN workflow_dispatch is the one
  # event GitHub lets the token start, so leftovers do not wait for the daily cron.
  actions: write

concurrency:
  # Its own group: a kit takes no claim, so it neither blocks nor waits on the applier.
  group: applyy-apply-kit
  # Never kill a running sweep mid-row (it would leave a rendered PDF without its note).
  # A newer trigger waits; if several pile up, GitHub keeps only the newest pending one,
  # which is fine because each sweep re-reads what is still due.
  cancel-in-progress: false

jobs:
  # One job: set up the worker exactly as apply.yml does, then build the kit.
  kit:
    # The same runner image the applier uses, so Chromium behaves identically.
    runs-on: ubuntu-latest
    # The kill. The worker stops starting kits at 3000 s, and 3000 + 180 setup + 300 for the kit in
    # flight + 30 teardown = 3510 <= 3600 (the applier's W31 arithmetic; pinned in apply-kit-sweep.test.ts).
    timeout-minutes: 60

    # NO job-level env, for the reason apply.yml gives: only the one step that runs the
    # worker may see the app-user password and the agent key.

    steps:
      # The same SHA-pinned setup as apply.yml, so the kit runs the exact worker the applier runs.
      - name: Check out the repository
        # Pinned to a full commit SHA (the repo's supply-chain rule); the tag is the trailing comment.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # History is irrelevant to the worker.
          fetch-depth: 1

      # pnpm before setup-node, whose pnpm cache resolution shells out to pnpm.
      - name: Install pnpm
        # Pinned to a full commit SHA (the repo's supply-chain rule); the tag is the trailing comment.
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          # The root package.json's packageManager version.
          version: 11.25.0

      - name: Set up Node
        # Pinned to a full commit SHA (the repo's supply-chain rule); the tag is the trailing comment.
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # The pinned runtime, as apply.yml.
          node-version: '24'
          # The pnpm store, restored between runs.
          cache: 'pnpm'

      # Exactly the committed lockfile.
      - name: Install dependencies
        # The whole workspace, from the committed lockfile: the worker imports shared packages by path.
        run: pnpm install --frozen-lockfile

      # The Chromium binary, restored when the lockfile has not changed.
      - name: Restore the Playwright browser cache
        id: playwright-cache
        # Pinned to a full commit SHA (the repo's supply-chain rule); the tag is the trailing comment.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          # Keyed on the lockfile, so a Playwright bump invalidates it.
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # Downloaded only on a cache miss.
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        # Run through pnpm's filter so it executes inside the worker package, as apply.yml does.
        run: pnpm --filter '@applyy/worker' exec playwright install --with-deps chromium

      # The system libraries on every run: the cache restores the binary, not the apt packages.
      - name: Install Chromium system dependencies
        # Run through pnpm's filter so it executes inside the worker package, as apply.yml does.
        run: pnpm --filter '@applyy/worker' exec playwright install-deps chromium

      # The kit(s). The id travels as an environment variable, never interpolated into the
      # shell line, so an input can never become a command; the worker validates its UUID shape.
      - name: Build apply kits (sweep, or the one given id)
        # Named, so the re-dispatch step can read this step's `redispatch` output.
        id: kit
        # Run through pnpm's filter so it executes inside the worker package, as apply.yml does.
        run: pnpm --filter '@applyy/worker' exec node src/cli/apply-kit.ts
        # Step-scoped, as in apply.yml: no action or install script sees these.
        env:
          # One application, or '' (every automatic trigger, and a blank dispatch) for the sweep.
          # Validated by shape in the worker (apply-kit-sweep.ts parseKitTarget).
          APPLY_KIT_ID: ${{ inputs.application_id }}
          # The batch one run builds (was a 5-kit cap until 2026-11-05); the rest go to the re-dispatch.
          APPLY_KIT_SWEEP_CAP: '25'
          # Supabase connection. Secrets, never committed (constraint #11).
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # Public by design; authority comes from the app user's JWT below.
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # The ordinary app user the applier signs in as, so every read and write runs under RLS.
          APPLYY_APP_USER_EMAIL: ${{ secrets.APPLYY_APP_USER_EMAIL }}
          # Same account.
          APPLYY_APP_USER_PASSWORD: ${{ secrets.APPLYY_APP_USER_PASSWORD }}
          # The note insert is admitted for agent 'applier' only with a valid agent key.
          APPLYY_AGENT_KEY: ${{ secrets.APPLYY_AGENT_KEY }}

      # Leftovers: the worker says redispatch=true only when the batch or the budget left due rows
      # UNTRIED and this run tried at least one (apply-kit-sweep.ts shouldRedispatch), so the chain always
      # shrinks the backlog and ends. Runs even after a red sweep (a failed row is per-row), never after a
      # cancel. The new run queues in the concurrency group behind this one.
      - name: Re-dispatch for the rows this run left
        if: ${{ !cancelled() && steps.kit.outputs.redispatch == 'true' }}
        # A blank sweep from main; the step's own token, scoped by the permissions block above.
        run: gh workflow run apply-kit.yml --ref main --repo "$REPO"
        env:
          # gh reads the token from here.
          GH_TOKEN: ${{ github.token }}
          # Passed as data, never interpolated into the shell line.
          REPO: ${{ github.repository }}
