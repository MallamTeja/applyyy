# applyy — daily remote-feed scout (RemoteOK, Jobicy, Arbeitnow).
#
# Runs worker/src/cli/scout-remote.ts, which queues remote tech jobs through the SAME
# path as the ATS scout (scout.yml): http(s)-only apply URLs, fingerprint dedupe via
# persistJobBatch, and insert-time screening, so rows land at passed_filters or
# dropped_filter and never pile up at discovered. Free: three public JSON feeds, one
# request each per day, no Playwright and no Gemini.
#
# Exists because the CLI had no workflow (2026-10-24): remote jobs arrived only when
# someone pressed the browser button.
name: applyy scout (remote feeds)

on:
  schedule:
    # Once a day at 01:30 UTC (07:00 IST). The feeds list their newest ~100 postings, so
    # daily catches them while they are fresh; GitHub cron is best-effort and may start late.
    - cron: '30 1 * * *'
  workflow_dispatch:
    inputs:
      # Rehearsal: fetch, parse and screen in memory, then stop before ANY write
      # (worker/test/remote-scout.test.ts: "dry_run performs zero DB writes").
      dry_run:
        # Shown beside the checkbox in the Actions UI.
        description: 'Fetch and screen in memory only; write nothing (no jobs, no applications, no agent_runs)'
        # A checkbox, so there is no free text to validate.
        type: boolean
        # The real run is the default, as in pregate-sweep.yml; the dispatcher opts INTO a rehearsal.
        default: false
      # Same override as scout.yml: discover while the kill switch is off.
      force:
        # Shown in the Actions UI.
        description: 'Set to "true" to discover jobs even if system_settings.system_enabled is false'
        # Optional; absent means the kill switch is respected.
        required: false
        # 'false' so a click-through respects the kill switch; overriding it is a typed choice.
        default: 'false'

# Read-only token: the job only talks to Supabase with its own credentials.
permissions:
  # contents:read is the floor GitHub allows.
  contents: read

# One remote scout at a time; its own group, so it never queues behind the ATS scout.
concurrency:
  # Fixed key: a run has no per-row scope.
  group: applyy-scout-remote
  # A queued run waits rather than cancelling one mid-write.
  cancel-in-progress: false

jobs:
  # Named for what it does.
  scout-remote:
    # Same image as scout.yml.
    runs-on: ubuntu-latest
    # Three HTTP requests and a few batched writes; the cap only stops a hung request burning minutes.
    timeout-minutes: 10

    # No job-level env: secrets are scoped to the one step that reads them (same rule as scout.yml).
    steps:
      # The worker source, at the commit being run.
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Only the tip is needed.
          fetch-depth: 1

      # The repo's only package manager, pinned to the same version as scout.yml.
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          # Exact pin; corepack refuses ranges.
          version: 11.25.0

      # Node 24 runs the .ts CLI directly (type stripping), as in scout.yml.
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # The repo's Node.
          node-version: '24'
          # Reuses the pnpm store between runs.
          cache: 'pnpm'

      # Lockfile-exact install; never rewrites pnpm-lock.yaml.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The run itself.
      - name: Run Scout Remote Discovery
        run: pnpm --filter '@applyy/worker' run scout:remote
        # Step-scoped: the only reader of these (worker/src/cli/scout-remote.ts).
        env:
          # Supabase project URL; secret so the project ref is not advertised.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # Public-by-design anon key; authority comes from the user JWT.
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # The app user the scout signs in as, so RLS applies.
          APPLYY_APP_USER_EMAIL: ${{ secrets.APPLYY_APP_USER_EMAIL }}
          # Its password: the reason this block is step-scoped at all.
          APPLYY_APP_USER_PASSWORD: ${{ secrets.APPLYY_APP_USER_PASSWORD }}
          # 'true' only for a manual run that ticked the box; a scheduled run has no inputs,
          # so it is always a real run.
          SCOUT_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
          # Allowlist of one case, copied from scout.yml: anything but an explicit manual
          # 'true' fails closed, so the cron always respects the kill switch.
          SCOUT_FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force == 'true' && 'true' || 'false' }}
