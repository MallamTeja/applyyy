# applyy — daily batched applier.
#
# BUDGET IS THE BINDING CONSTRAINT ON THIS PRODUCT (PROJECT_PLAN.md §2).
# GitHub Free gives 2,000 Actions minutes/month = ~66 min/day, and the repo must
# stay private (it holds the resume, CTC and personal answers) so the unlimited
# public-repo allowance is unavailable.
#
# THIS WORKFLOW PROCESSES THE WHOLE DAY'S QUEUE IN ONE RUN, DELIBERATELY.
# Measured on this repo: per-application browser work is ~2-4s, but per-RUN
# overhead (checkout + node + pnpm install + browser restore) is ~40-70s, and
# GitHub bills every job rounded UP to a whole minute. So:
#   35 separate runs = 35 x ~1 min overhead + ~53 min work  = ~88 min/day  OVER
#   1 batched run    =  1 x ~1 min overhead + ~53 min work  = ~54 min/day  FITS
# Batching is not an optimisation here; it is the difference between fitting the
# 66 min/day budget and burning the month in ~13 days. Do not split this into a
# per-application workflow.
name: applyy applier (daily batch)

on:
  # One scheduled run per day. 02:30 UTC = 08:00 IST, so the overnight ATS
  # postings are picked up and the freshness window (§13) is used well.
  # A scheduled run is DRY unless the repository variable APPLYY_CRON_LIVE is
  # exactly 'true' (see DRY_RUN below). Teja sets that variable himself, after a
  # local proof; until it exists, cron fills and screenshots without submitting.
  schedule:
    - cron: '30 2 * * *'
  # Manual trigger, needed for the §18.6 trust period where Teja watches a run.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Set to "false" ONLY to actually submit applications. Anything else is a dry run.'
        required: false
        # Defaults to the safe value so an operator who clicks straight through
        # cannot submit by accident (constraint #15).
        default: 'true'
      # Limits the run to ONE application (worker/src/claim-loop.ts). REQUIRED for a
      # live run (dry_run "false"): the step below refuses a live run without it, so
      # a manual dispatch can never submit the whole approved queue by accident.
      apply_only_id:
        description: 'Application UUID to process, alone. Required when dry_run is "false".'
        required: false
        # Empty means "whole queue", which only a DRY run may use.
        default: ''
      # APPLY ON APPROVE (P1-6, 2026-11-05): dispatch-apply sends "true" with dry_run "false" when Teja
      # approves and his auto_apply_on_approve switch is on. The ONE way a live manual run may take the
      # approved queue, up to 25 submit attempts per run (leftovers go to the next dispatch; the circuit
      # breaker and the settings daily cap still stop it). Exact "true" only; never combined with apply_only_id.
      drain_approved:
        description: 'Set to "true" (with dry_run "false") to submit approved rows, 25 per run. Sent by dispatch-apply.'
        required: false
        # Off unless asked for by name.
        default: 'false'

# Least privilege: the applier reads the repo and talks to Supabase over the
# network. It never needs to write back here, so it gets no write token at all.
permissions:
  contents: read

# Two applier runs at once could each claim work and submit. Submission is the
# one non-idempotent action in the system (§14), so overlap risks constraint #7.
concurrency:
  group: applyy-applier
  # DELIBERATELY false. Cancelling a run mid-submit produces exactly the crash
  # §14 warns about: a row stranded at `applying` with nobody knowing whether the
  # application went out. Better to let a run finish and skip the next one.
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    # Hard ceiling on budget damage. A hung browser or a retry loop cannot burn
    # more than this, which is roughly one day's allowance rather than a month's.
    timeout-minutes: 60
    # B1 (2026-11-05): the worker's re-dispatch verdict, handed to the separate redispatch job below.
    outputs:
      # 'true' or 'false', written by worker/src/cli/apply.ts (shouldRedispatchDrain) to GITHUB_OUTPUT.
      redispatch: ${{ steps.applier.outputs.redispatch }}

    # NO job-level env (moved 2026-10-05). Job-level env is visible to EVERY step,
    # including third-party actions and the dependency install scripts that
    # `pnpm install` runs (pnpm-workspace.yaml allowBuilds enables esbuild's and
    # playwright's postinstall). None of those need the app-user password; only
    # "Run the applier" reads these (worker/src/cli/apply.ts:77-81), so that step
    # is now the only place they exist.

    steps:
      # Shallow clone: history is irrelevant to the worker and fetching it costs
      # billable seconds on every single run.
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1

      # pnpm must exist before setup-node, because setup-node's pnpm cache
      # resolution shells out to pnpm to find the store path.
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          # Pinned to the version in the root package.json's packageManager
          # field; a floating version is how a lockfile silently drifts.
          version: 11.25.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Matches the pinned local runtime (PROJECT_PLAN.md §22) so a bug
          # cannot be a Node version difference between laptop and CI.
          node-version: '24'
          # Restores the pnpm store between runs; this is a large share of the
          # per-run overhead the batching argument above is about.
          cache: 'pnpm'

      # Frozen lockfile: CI installs exactly what is committed, and fails rather
      # than quietly resolving something new.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Chromium is ~130MB. Restoring it from cache instead of downloading it
      # saves roughly 30s of billable time on every run.
      - name: Restore the Playwright browser cache
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          # Keyed on the lockfile so a Playwright version bump invalidates the
          # cache automatically rather than serving a mismatched browser.
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # Only downloads on a cache miss. --with-deps pulls the system libraries
      # Chromium needs on a bare ubuntu runner.
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter '@applyy/worker' exec playwright install --with-deps chromium

      # The system libraries, on EVERY run. The cache above restores only
      # ~/.cache/ms-playwright — the browser binary — while --with-deps installs
      # apt packages into the runner image, which is fresh each job. So on a
      # cache HIT the step above is skipped and Chromium launches without its
      # shared libraries. Unconditional on purpose; on a miss it is a no-op
      # repeat of what --with-deps just did.
      - name: Install Chromium system dependencies
        run: pnpm --filter '@applyy/worker' exec playwright install-deps chromium

      # The run itself. The worker first sweeps stale claims (cleanup, so it runs even
      # while the system is off: W31), then checks the `system_enabled` kill switch
      # (§18.1) and claims nothing if it is off, so stopping everything never
      # requires deleting this cron or revoking a key at 2am.
      - name: Run the applier
        # Named, so the job's redispatch output can read this step's output (B1).
        id: applier
        # The run mode, then two guards, all in shell before the worker starts.
        # THE MODE (W30, wiring audit 2026-11-01) is decided here, not in a `${{ }}`
        # expression: GitHub's expression `==` ignores case, so `dry_run=FALSE` ran
        # live and `APPLYY_CRON_LIVE=TRUE` made cron live. Shell `[ = ]` is exact.
        # The raw input and variable arrive through env, never pasted into the
        # script text, so no input value can be run as shell code.
        # The guards are in shell because a workflow `env:` key cannot be
        # conditionally omitted:
        # 1. A LIVE MANUAL run must name one application. Without this, dry_run
        #    "false" would submit every approved row in one go. Scheduled runs are
        #    exempt: a live cron run (APPLYY_CRON_LIVE) is bounded instead by
        #    APPLY_MAX_SUBMITS and the worker's circuit breaker (claim-loop.ts).
        # 2. APPLY_ONLY_ID is exported ONLY when an id was given. The worker treats a
        #    set-but-blank value as an error (so a blank `$ID` never widens a local
        #    run), and scheduled runs supply no inputs at all, so passing the input
        #    straight through would make every cron run fail.
        run: |
          # THE SAFETY DEFAULT: dry, unless one of exactly two opt-ins holds below.
          DRY_RUN=true
          # Opt-in 1: a manual run whose dry_run input is the exact string "false".
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$DRY_RUN_INPUT" = "false" ]; then DRY_RUN=false; fi
          # Opt-in 2: a scheduled run while APPLYY_CRON_LIVE is the exact string "true".
          # Unset, "TRUE" or a typo compares unequal, so cron stays dry; a manual run never reads it.
          if [ "$EVENT_NAME" = "schedule" ] && [ "$CRON_LIVE" = "true" ]; then DRY_RUN=false; fi
          # Exported for the worker's gate, which also refuses anything but the exact "false"
          # (worker/src/submission-mode.ts), so the two checks fail closed independently.
          export DRY_RUN
          # Named in the log, so the run page says which mode ran and why.
          echo "DRY_RUN=$DRY_RUN (event $EVENT_NAME)"
          # The drain (P1-6): a manual run whose drain_approved input is the exact string "true".
          # Cron supplies no inputs, so a scheduled run never drains whatever leaks into the env.
          DRAIN=false
          # Exact comparison in the shell, like dry_run's (W30): "TRUE" or a typo is not a drain.
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$DRAIN_INPUT" = "true" ]; then DRAIN=true; fi
          # Named in the log beside DRY_RUN, so the run page says which scope ran.
          echo "DRAIN=$DRAIN"
          # A drain names the whole queue; a single id names one row. Both at once is ambiguous: refuse.
          if [ "$DRAIN" = "true" ] && [ -n "$ONLY_ID" ]; then
            # Annotated, so the reason shows on the run page.
            echo "::error::drain_approved and apply_only_id cannot both be set."
            # Red, before anything is claimed.
            exit 1
          fi
          # Guard 1: refuse a whole-queue live MANUAL submit, before anything is claimed, unless it is
          # the drain dispatch-apply asked for by name.
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$DRY_RUN" = "false" ] && [ -z "$ONLY_ID" ] && [ "$DRAIN" != "true" ]; then
            # Annotated as an error so the reason shows on the run page, not only in the log.
            echo "::error::dry_run=false requires apply_only_id (one application per live run) or drain_approved=true."
            # Non-zero, so the run is red rather than a silent no-op.
            exit 1
          fi
          # A drain gets a FINITE batch of 25 (2026-11-05 review): an unbounded drain with no daily cap could
          # outlast timeout-minutes and be killed mid-submit, stranding a row at `applying`. Leftovers go to
          # the run the redispatch job starts (B1); the breaker and max_applications_per_day still apply.
          # Other runs keep the env's '3'.
          if [ "$DRAIN" = "true" ]; then export APPLY_MAX_SUBMITS=25; fi
          # Guard 2: set the filter only when there is one.
          if [ -n "$ONLY_ID" ]; then export APPLY_ONLY_ID="$ONLY_ID"; fi
          # The applier itself, unchanged.
          pnpm --filter '@applyy/worker' run apply
        # Step-scoped: the ONLY step that reads any of these (apply.ts:77-81,
        # submission-mode.ts:56), so no action or install script can see them.
        env:
          # NO DRY_RUN here (W30): the script above computes it from the two raw
          # values below. A `${{ == }}` here would bring back the case-insensitive match.
          # The raw dry_run input, as typed; only its exact "false" opts a manual run in.
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          # The raw repository variable; only its exact "true" opts a scheduled run in.
          CRON_LIVE: ${{ vars.APPLYY_CRON_LIVE }}
          # Which trigger started this run; read by both opt-ins and by Guard 1.
          EVENT_NAME: ${{ github.event_name }}
          # The raw drain_approved input; only its exact "true" on a manual run drains the queue.
          DRAIN_INPUT: ${{ inputs.drain_approved }}
          # The per-run cap on real submit attempts (submitted + outcome unknown),
          # parsed strictly by the worker (claim-loop.ts parseMaxSubmits). It bounds
          # a live cron run, which names no apply_only_id.
          APPLY_MAX_SUBMITS: '3'
          # The raw input, read only by the shell guards above. Not named APPLY_ONLY_ID,
          # so an empty value never reaches the worker as "set but blank".
          ONLY_ID: ${{ inputs.apply_only_id }}
          # Supabase connection. Secrets, never committed (constraint #11).
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # The anon key is public-by-design and carries no privilege on its own;
          # every query's authority comes from the signed-in user's JWT below.
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # The worker signs in as an ORDINARY Supabase Auth user rather than using
          # a service-role key. This is the most important security property in the
          # workflow: every query then runs under exactly the same RLS policies as
          # the dashboard, so the worker cannot do anything Teja could not do
          # himself. A leaked service-role key would mean RLS bypassed on every
          # table and a rotation touching every consumer; a leaked app-user password
          # means one account, revocable from the dashboard in seconds.
          APPLYY_APP_USER_EMAIL: ${{ secrets.APPLYY_APP_USER_EMAIL }}
          # Same account as the email above; scoped here for the reason in the step comment.
          APPLYY_APP_USER_PASSWORD: ${{ secrets.APPLYY_APP_USER_PASSWORD }}
          # Proof that this caller is a machine agent, so the database lets it advance status
          # as 'applier' (20261008160000). Unset is safe until the hash is seeded; once seeded,
          # a missing secret makes every applier transition fail closed with 42501.
          APPLYY_AGENT_KEY: ${{ secrets.APPLYY_AGENT_KEY }}
          # AES-GCM key for the browser storageState held in Supabase Storage. The
          # state itself never lands in the repo (§10 defense 4). No code reads it
          # yet (no process.env read in worker/src as of 2026-10-05); kept here, on
          # the one step that will, rather than dropped, so behaviour is unchanged.
          STORAGE_STATE_ENC_KEY: ${{ secrets.STORAGE_STATE_ENC_KEY }}

      # NO ARTIFACT STEP, deliberately (removed 2026-10-24). Screenshots go to the
      # Supabase Storage bucket `screenshots` (apply-one.ts uploadScreenshot), and
      # the row's screenshot_storage_path points at them; nothing ever wrote the
      # worker/screenshots/ directory the old upload-artifact step read, so it only
      # ever warned "No files were found". An unknown submit's cause is recorded in
      # agent_runs.error_detail (claim-loop.ts closeRun), not in a CI artifact.

  # B1 (2026-11-05, Teja: "no caps; run every time a job is in the queue"): a live drain that stopped on
  # its batch of 25 or its 3000 s budget, having sent at least one application, starts the next drain
  # run itself. The worker decides (claim-loop.ts shouldRedispatchDrain: never on the breaker, the kill
  # switch, the daily cap, a one-row run, a drained queue or a dry run); this `if` ALSO requires that
  # this run was a manual live drain, and the new run gets exactly the same two inputs, so a dry run or
  # a cron run can never start a live one. Its own job, so the applier step (secrets, third-party code)
  # never holds a token able to start workflows. The new run queues in applyy-applier behind this one.
  redispatch:
    # After the applier, reading its verdict.
    needs: apply
    # A manual live drain, the worker's exact 'true', and never after a cancel.
    # (Expression == ignores case, W30, so dry_run "FALSE" matches here; harmless: that run was DRY in the
    # exact shell check above, so the worker reported live=false and wrote redispatch=false.)
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.dry_run == 'false' && inputs.drain_approved == 'true' && needs.apply.outputs.redispatch == 'true' }}
    # Nothing to set up: gh is preinstalled on the runner.
    runs-on: ubuntu-latest
    # One API call.
    timeout-minutes: 5
    # The one job allowed to start a workflow; no repository access at all.
    permissions:
      actions: write
    steps:
      # The same inputs this run had: live, the approved queue.
      - name: Re-dispatch the drain for the rows this run left
        run: gh workflow run apply.yml --ref main --repo "$REPO" -f dry_run=false -f drain_approved=true
        env:
          # gh reads the token from here.
          GH_TOKEN: ${{ github.token }}
          # Passed as data, never interpolated into the shell line.
          REPO: ${{ github.repository }}
