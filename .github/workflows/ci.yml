# =============================================================================
# CI — typecheck and test every part of the repo on every push and PR to main.
#
# WHY THIS EXISTS: until 2026-10-05 no workflow typechecked or tested anything.
# apply.yml / scout.yml / keepalive.yml only RUN the product, so every test count
# quoted in this repo ("598/598", "273/273") was measured on somebody's laptop and
# nothing stopped a red tree from being pushed. Four of those laptop runs on
# 2026-10-04 also nearly passed vacuously (deno over zero files, `tests 0`), which
# is why the guards below assert the work HAPPENED, not just that nothing failed.
#
# Needs NO secrets: every step is static analysis or hermetic tests (the browser
# tests run against local fixtures/servers, never a live site or database). That is a
# requirement, not an accident — a PR from a fork gets no secrets, and a check
# that only works with credentials is a check that silently skips.
#
# WHY ONE JOB, NOT SIX (P1-7, 2026-11-05): this private repo is on the Free plan's 2,000
# Actions minutes and went over in October (2,032). Measured over 2026-10-22..11-05, ci.yml
# was 961 of 1,803 billed minutes (128 runs). GitHub bills each JOB rounded UP to a whole
# minute, and the six jobs cost 9 billed minutes a run: four of them ran 8-21 s yet billed a
# minute each, and web and worker each repeated checkout, pnpm install and Chromium's apt
# dependencies (~20 s). One job does setup once: ~215 s of steps, 4 billed minutes. The cost
# is wall clock (~3.6 min instead of ~2.2) and one combined check in the PR list. Every check
# step runs even after another check fails (see `if:` below), so one red run still reports
# every failure, as six jobs did.
# =============================================================================
# Shown as the workflow name in the Actions tab and in required-check settings.
name: ci

# Main is the only branch that deploys (Vercel builds it), so it is the one to guard.
on:
  # Catches direct pushes, which is how most work lands in this repo today.
  push:
    # Only main; feature branches are covered by their pull request.
    branches: [main]
    # Docs-only pushes skip CI: 22 of the 128 runs above (152 min) changed only docs/ or
    # *.md. GitHub skips a run only when EVERY changed path matches, so a push that mixes a
    # doc with code still runs (worker/test/ci-workflow.test.ts proves both cases). No test
    # or code reads a .md outside docs/ (checked 2026-11-05); one that starts to must narrow
    # this. A docs-only commit therefore has NO ci run: read the verdict of the newest code
    # commit at or before it (CLAUDE.md §4 reads CI by full SHA).
    paths-ignore:
      # Handoffs, audits, plans: prose only.
      - 'docs/**'
      # READMEs, CLAUDE.md, SCHEMA_CONTRACT.md and the rest, at any depth including the root.
      - '**/*.md'
  # Catches the change before it lands, when one goes through review.
  pull_request:
    # PRs into main are the ones that would deploy.
    branches: [main]
    # Same list as push; the test asserts the two stay identical.
    paths-ignore:
      # Same as push.
      - 'docs/**'
      # Same as push.
      - '**/*.md'

# Read-only token: CI reads the repo and writes nothing back.
permissions:
  # Checkout needs read; nothing here needs write.
  contents: read

# Cancel superseded PR runs, but NEVER cancel a run on main.
#
# The first version grouped by ref with cancel-in-progress: true. Four sessions
# push to main concurrently in this repo, so each push cancelled the previous
# commit's run before it finished — runs 37332476592 and 37332628545 were both
# cancelled that way, leaving those commits with no verdict at all. On main every
# push is a DIFFERENT commit that needs its own answer; on a PR, a new push to
# the same branch genuinely does make the old run irrelevant.
concurrency:
  # PRs group by ref (one live run per PR); main groups by sha (one per commit,
  # so two different commits never share a group and never cancel each other).
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  # Only PR runs dedupe; still saves the Actions minutes PROJECT_PLAN §2 budgets.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Defaults applied to every `run:` step.
defaults:
  # Bash everywhere, so pipefail below means the same thing in each step.
  run:
    # `-o pipefail` makes a piped checker's failure fail the step, instead of
    # the step reporting the exit code of `grep`/`tail` (CLAUDE.md §4 trap).
    shell: bash -eo pipefail {0}

# No repo-wide PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD. The first run of this file set
# it globally on the belief that "no job launches a browser" — wrong: the web
# e2e suite and several worker tests launch real Chromium, and both failed
# with "Executable doesn't exist". That same run settled the CLAUDE.md §8
# question: `pnpm install` does NOT download browsers (they were absent after
# a full install), so the skip flag was never saving anything at install time.
# Chromium is installed explicitly, from a cache, below.

jobs:
  # The one job. Setup steps first; every check after them carries the same `if:`.
  ci:
    # A readable name in the PR checks list.
    name: ci (deno, edge, packages, web, worker)
    # Linux runner: cheapest per minute and matches the deploy target's OS.
    runs-on: ubuntu-latest
    # The six old caps were 10/10/10/15/20/20 for parallel jobs; serial, the steps take ~4
    # min warm. 30 leaves room for a cold pnpm store and a Chromium download, and still
    # stops a hang before it burns the month.
    timeout-minutes: 30
    steps:
      # ---------------------------------------------------------------------
      # Setup. Default `if: success()`: a setup failure skips the rest of setup,
      # so the LAST setup step succeeding means every setup step did.
      # ---------------------------------------------------------------------
      # The source to check, test and build.
      - name: Checkout
        # Same pin as every other workflow.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        # Full history, so the gitleaks check below can scan exactly the pushed commit range
        # (before..after); a depth-1 clone holds only the tip and the range would not resolve.
        with:
          # 0 = every commit. The repo is small; this costs seconds.
          fetch-depth: 0
      # The Deno toolchain the Edge Functions are written for.
      - name: Install Deno
        # Official action, pinned by SHA like the others.
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        # Pinned to the version the repo was last verified with locally.
        with:
          # deno 2.9.6 is what produced the clean local runs on 2026-10-04.
          deno-version: v2.9.6
      # pnpm must exist before setup-node, whose pnpm cache shells out to pnpm.
      - name: Install pnpm
        # Same action and pin as apply.yml.
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        # The exact version package.json's packageManager field pins.
        with:
          # Matches "packageManager": "pnpm@11.25.0".
          version: 11.25.0
      # Node plus the pnpm store cache.
      - name: Install Node
        # Same pin as apply.yml.
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        # Runtime and cache settings.
        with:
          # Node 24 strips TypeScript natively, which is how every node --test suite runs.
          node-version: '24'
          # Restores the pnpm store between runs; install is most of the setup.
          cache: 'pnpm'
      # Exactly the locked dependency set — never a resolve. Also creates the workspace
      # links that packages/* tests need to import @applyy/shared-types by its bare name.
      - name: pnpm install --frozen-lockfile
        # Frozen: CI must fail on a lockfile drift, not quietly repair it.
        run: pnpm install --frozen-lockfile
      # The web e2e suite and several worker tests (extract-fields, no-spurious-blockers,
      # render-resume-pdf) drive real Chromium. ~130MB, so cached.
      - name: Restore the Playwright browser cache
        # Referenced by the conditional install below.
        id: playwright-cache
        # Same action and pin as apply.yml.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        # Same path and key scheme as apply.yml, so the two share one cache.
        with:
          # Where Playwright keeps downloaded browsers on Linux.
          path: ~/.cache/ms-playwright
          # Keyed on the lockfile: a playwright bump changes it and misses the cache.
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # Downloads the browser only on a cache miss.
      - name: Install Chromium (cache miss)
        # Skipped on a hit; the system libraries step below still runs.
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        # The worker's playwright. CLAUDE.md §8: worker and web declare playwright and are bumped
        # together, so both resolve the same browser revision from this one download.
        run: pnpm --filter '@applyy/worker' exec playwright install chromium
      # System libraries every run: the cache restores the binary, not apt packages. Once per
      # run now; the old web and worker jobs each paid this ~20 s.
      - name: Install Chromium system dependencies
        # Read by every check's `if:` below: success here means all of setup succeeded.
        id: setup-done
        # Same reasoning as apply.yml's unconditional install-deps step.
        run: pnpm --filter '@applyy/worker' exec playwright install-deps chromium

      # ---------------------------------------------------------------------
      # Checks. Each one runs `if: ${{ !cancelled() && steps.setup-done.outcome == 'success' }}`:
      # it runs even when an EARLIER CHECK failed (six jobs used to report independently, and
      # a red tsc must not hide a red test), but not after a setup failure, where every check
      # would fail for the same unrelated reason. A cancelled run stops at once.
      # ---------------------------------------------------------------------

      # (a) Deno typecheck of the Edge Functions. `pnpm run typecheck` does NOT reach
      # this tree (it is a separate Deno project with no package.json), which is how
      # four type errors survived six days in September.
      - name: deno check --reload, and assert it checked files
        # Runs after another check fails; skipped only after a setup failure or a cancel.
        if: ${{ !cancelled() && steps.setup-done.outcome == 'success' }}
        # The Deno project root; deno.json lives here.
        working-directory: supabase/functions
        run: |
          # Every function entry point plus every non-test shared module. Test
          # files are excluded because deno.json excludes them (they import node:test).
          mapfile -t files < <(ls */index.ts; find _shared -name '*.ts' ! -name '*.test.ts')
          # Fail loudly if the glob itself matched nothing: an empty list is the
          # "deno check over zero files exits 0" trap from CLAUDE.md §4.
          [ "${#files[@]}" -gt 0 ] || { echo "no files matched"; exit 1; }
          # Shown so a reader of the log can see what was covered.
          echo "checking ${#files[@]} files"
          # --reload defeats the incremental cache, which would otherwise print
          # nothing on an unchanged tree. Output kept for the count below; the
          # pipefail default means deno's own non-zero exit still fails the step.
          deno check --reload "${files[@]}" 2>&1 | tee deno-check.log
          # Strip ANSI colour codes, then count "Check" lines — the colour codes
          # are why a plain `grep ^Check` reports zero on a healthy run.
          checks=$(sed 's/\x1b\[[0-9;]*m//g' deno-check.log | grep -c '^Check' || true)
          # Printed so the number is visible in the job log.
          echo "Check lines: $checks"
          # Must EQUAL the files passed (CLAUDE.md §4), not merely exceed zero: a
          # partial check is as silent as an empty one. Measured 83 == 83 locally.
          [ "$checks" -eq "${#files[@]}" ] || { echo "checked $checks of ${#files[@]} files"; exit 1; }

      # (b) Edge Function unit tests. They run under Node (Node 24 strips types),
      # not `deno test`, because they import node:test — see package.json's note on
      # test:functions. They import no npm packages.
      - name: edge function tests (node --test), and assert tests ran
        # Same gate as every check.
        if: ${{ !cancelled() && steps.setup-done.outcome == 'success' }}
        run: |
          # From the repo root, because the glob is root-relative; run from the
          # wrong cwd it matches nothing and prints `tests 0` / `fail 0` (CLAUDE.md §4).
          node --test "supabase/functions/**/*.test.ts" 2>&1 | tee edge-tests.log
          # Only the summary line ("ℹ tests 606", ending the line), so a test TITLE
          # containing "tests 3" can never be read as the total.
          total=$(grep -E 'ℹ tests [0-9]+$' edge-tests.log | tail -1 | grep -oE '[0-9]+$' || echo 0)
          # A before() hook that cannot import CANCELS tests: neither passed nor failed (CLAUDE.md §5).
          cancelled=$(grep -E 'ℹ cancelled [0-9]+$' edge-tests.log | tail -1 | grep -oE '[0-9]+$' || echo 0)
          # Audit W35: a describe() body that throws before its first it() drops its tests
          # with fail 0, cancelled 0 AND exit 0 (measured on Node 24.14). Its only trace is
          # a line starting with ✖, which node prints for every failed test or suite.
          failed=$(grep -cE '^[[:space:]]*✖' edge-tests.log || true)
          # Printed so all three counts are visible in the job log.
          echo "edge tests: $total, cancelled: $cancelled, ✖ lines: $failed"
          # `fail 0` beside `tests 0` is a glob that matched nothing, not a pass.
          [ "$total" -gt 0 ] || { echo "no edge tests ran"; exit 1; }
          # A cancelled test proved nothing.
          [ "$cancelled" -eq 0 ] || { echo "$cancelled edge tests were cancelled"; exit 1; }
          # Red even when node exited 0: a failure marker is a failure.
          [ "$failed" -eq 0 ] || { echo "$failed ✖ lines: a test or suite failed (W35)"; exit 1; }

      # (b2) packages/shared-types tests (added 2026-11-01). They hold the contract's
      # parity checks, e.g. "every table in the migrations has a Row type". No job ran
      # them, so 4f53c25 landed a table without a Row type on a green main (fixed in
      # 7c182f6). They import only node builtins and ../src.
      - name: shared-types tests (node --test), and assert tests ran
        # Same gate as every check.
        if: ${{ !cancelled() && steps.setup-done.outcome == 'success' }}
        run: |
          # From the repo root, because the glob is root-relative (CLAUDE.md §5).
          # Actions' bash runs with pipefail, so a failing test fails this line despite tee.
          node --test "packages/shared-types/test/**/*.test.ts" 2>&1 | tee shared-types-tests.log
          # Only the summary line ("ℹ tests 27"), never a test title containing the words.
          total=$(grep -E 'ℹ tests [0-9]+$' shared-types-tests.log | tail -1 | grep -oE '[0-9]+$' || echo 0)
          # A before() hook that cannot import CANCELS tests: neither passed nor failed (CLAUDE.md §5).
          cancelled=$(grep -E 'ℹ cancelled [0-9]+$' shared-types-tests.log | tail -1 | grep -oE '[0-9]+$' || echo 0)
          # Audit W35: a describe() body that throws first leaves fail 0, cancelled 0, exit 0;
          # only a line starting with ✖ shows it (see the edge tests step).
          failed=$(grep -cE '^[[:space:]]*✖' shared-types-tests.log || true)
          # Printed so all three counts are visible in the job log.
          echo "shared-types tests: $total, cancelled: $cancelled, ✖ lines: $failed"
          # `fail 0` beside `tests 0` is a glob that matched nothing, not a pass.
          [ "$total" -gt 0 ] || { echo "no shared-types tests ran"; exit 1; }
          # A cancelled test proved nothing.
          [ "$cancelled" -eq 0 ] || { echo "$cancelled shared-types tests were cancelled"; exit 1; }
          # Red even when node exited 0: a failure marker is a failure.
          [ "$failed" -eq 0 ] || { echo "$failed ✖ lines: a test or suite failed (W35)"; exit 1; }

      # (b3) The other workspace packages' tests (added 2026-11-02, audit W13). No job
      # ran them, including master-robots: the robots.txt gate that scout-ats, scout-web,
      # job-link-intake, _shared/http/transport.ts and worker/src/apply-one.ts import.
      # A gate regression would have landed on a green main. Three of the four import
      # @applyy/shared-types by its bare name, which resolves only through the workspace
      # links pnpm install created above. No browser: none of these suites launches Chromium.
      - name: package tests (node --test per package), and assert each ran
        # Same gate as every check.
        if: ${{ !cancelled() && steps.setup-done.outcome == 'success' }}
        run: |
          # An unmatched glob expands to nothing rather than to its own literal text.
          shopt -s nullglob
          # Counts the packages actually tested, so an empty loop cannot pass.
          ran=0
          # Every package with a test dir, so a package added later is covered
          # without editing this file.
          for dir in packages/*/test; do
            # The package folder name, e.g. master-robots.
            pkg=$(basename "$(dirname "$dir")")
            # (b2) above already runs shared-types.
            if [ "$pkg" = shared-types ]; then continue; fi
            # Root-relative glob; pipefail makes a failing test fail this line despite tee.
            node --test "packages/$pkg/test/**/*.test.ts" 2>&1 | tee "$pkg-tests.log"
            # Only the anchored summary line, never a test title containing the words.
            total=$(grep -E 'ℹ tests [0-9]+$' "$pkg-tests.log" | tail -1 | grep -oE '[0-9]+$' || echo 0)
            # A before() hook that cannot import CANCELS tests (CLAUDE.md §5).
            cancelled=$(grep -E 'ℹ cancelled [0-9]+$' "$pkg-tests.log" | tail -1 | grep -oE '[0-9]+$' || echo 0)
            # Audit W35: a describe() body that throws first shows only as a ✖ line.
            failed=$(grep -cE '^[[:space:]]*✖' "$pkg-tests.log" || true)
            # Printed so every package's counts are visible in the job log.
            echo "$pkg tests: $total, cancelled: $cancelled, ✖ lines: $failed"
            # `fail 0` beside `tests 0` is a glob that matched nothing, not a pass.
            [ "$total" -gt 0 ] || { echo "no $pkg tests ran"; exit 1; }
            # A cancelled test proved nothing.
            [ "$cancelled" -eq 0 ] || { echo "$cancelled $pkg tests were cancelled"; exit 1; }
            # Red even when node exited 0: a failure marker is a failure.
            [ "$failed" -eq 0 ] || { echo "$failed ✖ lines in $pkg: a test or suite failed (W35)"; exit 1; }
            # Plain assignment: ((ran++)) returns 1 when ran is 0, which -e treats as a failure.
            ran=$((ran + 1))
          done
          # Printed so the number of packages covered is visible in the job log.
          echo "packages tested: $ran"
          # No package matched at all: the loop above never ran a single check.
          [ "$ran" -gt 0 ] || { echo "no package test dirs matched"; exit 1; }

      # (c) Web app: typecheck, production build, tests. The build matters on its own:
      # Vercel deploys whatever this builds, and nothing else in CI builds apps/web.
      # Type errors the Vite build would otherwise strip and ship.
      - name: web tsc --noEmit
        # Same gate as every check.
        if: ${{ !cancelled() && steps.setup-done.outcome == 'success' }}
        # The web package's own tsconfig.
        working-directory: apps/web
        # The package-local binary, as CLAUDE.md §4 documents.
        run: ./node_modules/.bin/tsc --noEmit
      # W36 (2026-11-10): the app tsconfig roots only src/, and `node --test` strips types without
      # checking them, so the web TESTS were never type-checked and their fakes drifted from the real
      # types (134 errors on the first run). tsconfig.test.json extends the app config and adds test/.
      - name: web tests tsc --noEmit (tsconfig.test.json)
        # Same gate as every check.
        if: ${{ !cancelled() && steps.setup-done.outcome == 'success' }}
        # The web package; tsconfig.test.json lives beside its tsconfig.json.
        working-directory: apps/web
        # The package-local binary, the same form as the step above.
        run: ./node_modules/.bin/tsc --noEmit -p tsconfig.test.json
      # The exact artifact Vercel would deploy; a failure here is a failed deploy.
      - name: web vite build
        # Same gate as every check.
        if: ${{ !cancelled() && steps.setup-done.outcome == 'success' }}
        # Same package.
        working-directory: apps/web
        # No env on purpose: the runner has no .env.local, so this builds "unconfigured",
        # which vite.config.ts allows (only a non-anon key is fatal). It proves the
        # shipped code compiles; it is NOT what the e2e suite runs against (next step).
        run: ./node_modules/.bin/vite build
      # The bundle the e2e suite serves. Its config is the committed apps/web/.env.e2e
      # (public project URL + unsigned placeholder anon JWT), which Vite loads ABOVE any
      # .env.local, so CI and every machine test the same bundle. Without it the shell
      # stops at sign-in and the suite fails with E2E_DIST_UNCONFIGURED (run 37333298262
      # was the 8-timeout version of that). Runs second so dist/ is the e2e bundle.
      - name: web vite build (e2e mode)
        # Same gate as every check.
        if: ${{ !cancelled() && steps.setup-done.outcome == 'success' }}
        # Same package.
        working-directory: apps/web
        # --mode e2e selects .env.e2e; overwrites the plain build's dist/.
        run: ./node_modules/.bin/vite build --mode e2e
      # T6 (2026-11-10): the worker e2e runner (synthetic resume -> real PDF, then a click-through of the e2e
      # bundle). It sat red from 2026-10-04 to 2026-11-10 because nothing ran it; CI runs it now so it cannot rot
      # again. MUST stay after the e2e-mode build: its dist guard refuses any other bundle. ~10 s.
      - name: worker e2e runner
        # Same gate as every check.
        if: ${{ !cancelled() && steps.setup-done.outcome == 'success' }}
        # The runner resolves its imports relative to worker/.
        working-directory: worker
        # A hang (Chromium print, pdf.js) fails in minutes, not at the 30-minute job timeout.
        timeout-minutes: 3
        # Plain Node with type stripping, the same command as `pnpm test:e2e`; exits 1 naming the failed stage.
        run: node --experimental-strip-types test/e2e-runner.mjs
      # The web test suite, with the same vacuous-pass guard as the edge tests.
      - name: web tests, and assert tests ran
        # Same gate as every check.
        if: ${{ !cancelled() && steps.setup-done.outcome == 'success' }}
        run: |
          # `@applyy/web`, NOT `web`: `--filter web` matches no package and exits 0
          # having run nothing (CLAUDE.md §4).
          pnpm --filter @applyy/web test 2>&1 | tee web-tests.log
          # Same anchored summary-line match as the edge tests, for the same reason.
          total=$(grep -E 'ℹ tests [0-9]+$' web-tests.log | tail -1 | grep -oE '[0-9]+$' || echo 0)
          # A before() hook that cannot import CANCELS tests: neither passed nor failed (CLAUDE.md §5).
          cancelled=$(grep -E 'ℹ cancelled [0-9]+$' web-tests.log | tail -1 | grep -oE '[0-9]+$' || echo 0)
          # Audit W35: a describe() body that throws first leaves fail 0, cancelled 0, exit 0;
          # only a line starting with ✖ shows it (see the edge tests step).
          failed=$(grep -cE '^[[:space:]]*✖' web-tests.log || true)
          # Printed so all three counts are visible in the job log.
          echo "web tests: $total, cancelled: $cancelled, ✖ lines: $failed"
          # A zero total means the filter or glob matched nothing.
          [ "$total" -gt 0 ] || { echo "no web tests ran"; exit 1; }
          # A cancelled test proved nothing.
          [ "$cancelled" -eq 0 ] || { echo "$cancelled web tests were cancelled"; exit 1; }
          # Red even when node exited 0: a failure marker is a failure.
          [ "$failed" -eq 0 ] || { echo "$failed ✖ lines: a test or suite failed (W35)"; exit 1; }
      # The Vercel render function (api/render-job-page.ts, 2026-11-01) runs a headless
      # browser on URLs from strangers' posts; its SSRF and auth guards live in these tests.
      # They import playwright-core and @sparticuz/chromium, which only the install above
      # provides; Vercel deploys api/ on the same push as the web build.
      - name: render function (tsc, tests), and assert tests ran
        # Same gate as every check.
        if: ${{ !cancelled() && steps.setup-done.outcome == 'success' }}
        run: |
          # The web package's tsc binary over the function's own typecheck-only tsconfig.
          apps/web/node_modules/.bin/tsc -p api/tsconfig.json
          # Root-relative glob; pipefail makes a failing test fail this line despite tee.
          node --test "api/_render/*.test.ts" 2>&1 | tee api-tests.log
          # Only the anchored summary line, never a test title containing the words.
          total=$(grep -E 'ℹ tests [0-9]+$' api-tests.log | tail -1 | grep -oE '[0-9]+$' || echo 0)
          # A before() hook that cannot import CANCELS tests: neither passed nor failed (CLAUDE.md §5).
          cancelled=$(grep -E 'ℹ cancelled [0-9]+$' api-tests.log | tail -1 | grep -oE '[0-9]+$' || echo 0)
          # Audit W35: a describe() body that throws first leaves fail 0, cancelled 0, exit 0;
          # only a line starting with ✖ shows it (see the edge tests step).
          failed=$(grep -cE '^[[:space:]]*✖' api-tests.log || true)
          # Printed so all three counts are visible in the job log.
          echo "render function tests: $total, cancelled: $cancelled, ✖ lines: $failed"
          # `fail 0` beside `tests 0` is a glob that matched nothing, not a pass.
          [ "$total" -gt 0 ] || { echo "no render function tests ran"; exit 1; }
          # A cancelled test proved nothing.
          [ "$cancelled" -eq 0 ] || { echo "$cancelled render function tests were cancelled"; exit 1; }
          # Red even when node exited 0: a failure marker is a failure.
          [ "$failed" -eq 0 ] || { echo "$failed ✖ lines: a test or suite failed (W35)"; exit 1; }

      # (d) Worker: typecheck and vitest. This is the component that types into real
      # employer forms, so it is the last place a type error should reach unnoticed.
      # Covers src/** and test/** (worker/tsconfig.json); scripts/** is outside it.
      - name: worker tsc --noEmit
        # Same gate as every check.
        if: ${{ !cancelled() && steps.setup-done.outcome == 'success' }}
        # The worker's own tsconfig.
        working-directory: worker
        # The package-local binary.
        run: ./node_modules/.bin/tsc --noEmit
      # vitest exits non-zero on failure AND on "no test files found", so its own
      # exit code is already a non-vacuous guard here.
      - name: worker vitest run
        # Same gate as every check.
        if: ${{ !cancelled() && steps.setup-done.outcome == 'success' }}
        # The worker package.
        working-directory: worker
        # Runs the suite once, no watch mode.
        run: ./node_modules/.bin/vitest run

      # (j) Secret scan. GitHub secret scanning and code scanning are OFF on this private repo
      # (`…/secret-scanning/alerts` 404 "disabled"; docs/security/2026-11-05-vulnerability-remeasure.md
      # finding #2), so a leaked key would raise no alert. gitleaks over the commits this push or PR
      # adds is the free fallback. Diff-only on purpose: the remeasure's static scan found 0
      # hardcoded keys in the tree, and scanning only the new range keeps the step to seconds.
      - name: gitleaks secret scan of the pushed commits
        # Runs after another check fails; skipped only after a setup failure or a cancel.
        if: ${{ !cancelled() && steps.setup-done.outcome == 'success' }}
        # The commit range, from the event, passed as env so no expression is spliced into the script.
        env:
          # A PR scans from its base; a push from the previous tip of main.
          RANGE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          # A PR scans to its head; a push to the commit being tested.
          RANGE_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # Exact release, never "latest": a moved tag must not change what CI runs.
          version=8.30.1
          # sha256 of gitleaks_8.30.1_linux_x64.tar.gz from the release's checksums.txt (read
          # 2026-11-05). Hard-coded, so a swapped download fails the check instead of running.
          expected=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          # Fetch the official release tarball; -f makes an HTTP error fail the step.
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          # Refuse to run anything whose bytes are not the pinned ones.
          echo "${expected}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          # Only the binary is needed out of the archive.
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          # A brand-new branch has an all-zero "before"; then scan everything reachable from head.
          if [ -z "$RANGE_BASE" ] || [ "$RANGE_BASE" = "0000000000000000000000000000000000000000" ]; then
            # No previous tip to diff from.
            log_opts="$RANGE_HEAD"
          else
            # Only the commits this push or PR adds.
            log_opts="${RANGE_BASE}..${RANGE_HEAD}"
          fi
          # Shown so the log says what was covered.
          echo "gitleaks ${version} scanning ${log_opts}"
          # --redact keeps a found secret out of the log; --exit-code 1 makes a finding fail CI.
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --exit-code 1 --log-opts="$log_opts" .
