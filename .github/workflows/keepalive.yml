# !! PENDING TEJA'S EXPLICIT APPROVAL — DO NOT ENABLE, PUSH OR TRIGGER. !!
# This workflow PUSHES A COMMIT (see the final step), which is the class of
# action Teja's standing "never push" rule exists to cover. Its presence in the
# repo is NOT consent. applyyy-d8 has put the decision to him directly. Until he
# answers, this file is a proposal that happens to be written in YAML.
#
# applyy — keepalive for the two silent deaths (PROJECT_PLAN.md §14).
#
# Neither of these failures produces an error. They just stop, and the system
# looks healthy while no applications go out and no interviews arrive:
#
#   1. Supabase PAUSES a free project after 1 WEEK of no database activity.
#   2. GitHub DISABLES scheduled workflows after 60 DAYS of repo inactivity —
#      which would silently switch off apply.yml, the entire product.
#
# Death 2 is the nastier one: it disables the very cron that was preventing
# death 1, so a single period of inactivity takes out both at once.
#
# CADENCE: every 3 days, not weekly. Supabase's window is 7 days, and a weekly
# job that slips or fails once has already missed it. Three days gives two
# clear misses of margin. Cost is ~10 billed minutes/month against 2,000.
name: applyy keepalive

on:
  # Every third day at 06:15 UTC. Deliberately offset from the applier's 02:30
  # so a broken shared step shows up as one failure, not two simultaneous ones.
  schedule:
    - cron: '15 6 */3 * *'
  # Manual trigger so the keepalive can be proven to work without waiting 3 days.
  workflow_dispatch:

# Needs write access purely to push the timestamp commit described below. This
# is the only workflow in the repo with write permission, and it is scoped to
# this job alone rather than granted at the workflow level by default.
permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    # A keepalive that hangs is a keepalive that is not alive. Fail fast and
    # loudly rather than holding a runner for the default six hours.
    timeout-minutes: 5

    # NO job-level env (moved 2026-10-05). Job env reaches every action, every
    # install script, AND the branch-push step below, which runs with a
    # contents:write token — none of which need the app-user password. Only the
    # ping reads these (worker/src/cli/keepalive.ts:37-40).

    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.25.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # DEATH 1. A real query against a real table; a request that merely
      # reaches the API gateway does not count as database activity, so this
      # must touch Postgres. It also writes an `agent_runs` row, which is what
      # lets the health page say "keepalive last ran 9 days ago" (§14) instead
      # of leaving Teja to believe the automation is fine.
      - name: Ping Supabase so the project does not pause
        run: pnpm --filter '@applyy/worker' run keepalive
        # Step-scoped: the only reader of these (keepalive.ts:37-40).
        env:
          # The DB ping needs a real connection; without it the Supabase half of
          # this job is a no-op that looks like it worked.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # Same ordinary-user auth as the applier: no service-role key anywhere in
          # this repo's workflows, so a leaked runner secret costs one revocable
          # account rather than RLS-bypassed access to every table.
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # The app user the ping signs in as.
          APPLYY_APP_USER_EMAIL: ${{ secrets.APPLYY_APP_USER_EMAIL }}
          # Its password, now visible to this one step only.
          APPLYY_APP_USER_PASSWORD: ${{ secrets.APPLYY_APP_USER_PASSWORD }}

      # DEATH 2. Repository activity is what stops GitHub disabling the cron.
      #
      # DECISION FOR TEJA — this step pushes a commit, which is the only way to
      # register repo activity from inside Actions. It is scoped as narrowly as
      # possible: the commit is made by github-actions[bot], contains only a
      # timestamp, and goes to a DEDICATED BRANCH, never to main. Teja's
      # main-branch history stays exactly as he wrote it.
      #
      # If even that is unwanted, the alternative is a calendar reminder to open
      # the repo every 60 days — which is a human keepalive, and humans forget,
      # which is precisely the failure mode §14 exists to prevent.
      - name: Touch the keepalive timestamp on a dedicated branch
        run: |
          # Identify as the Actions bot, not as Teja; the commit log should make
          # it obvious no human wrote this.
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # An orphan branch on first run, reused afterwards. Orphan keeps the
          # keepalive history completely disjoint from main's history.
          git checkout -B automation-keepalive
          # The payload is one line: when this last proved the repo was active.
          date -u +'%Y-%m-%dT%H:%M:%SZ' > .keepalive
          # Stage only the timestamp file by explicit path. Never `git add -A`.
          git add .keepalive
          # --allow-empty so a same-second rerun still produces the commit that
          # constitutes the activity signal.
          git commit --allow-empty -m 'chore: keepalive timestamp'
          # Force-push the dedicated branch only. main is never a target here.
          git push --force origin automation-keepalive
