# Drains the pre-screen backlog on demand: pages the whole `discovered` queue through the
# normalizer (?limit=200), then the whole `deduped` queue through the screener (?limit=100).
# Exists because nothing else ever calls these two functions at scale: the scouts screen at
# insert time (scout-ats/index.ts:536-560), the web batch modal moves 10 rows per click
# (apps/web/src/data/pipelineRunner.ts:57), and rows inserted BEFORE insert-time screening
# sit at discovered/deduped forever. Same credential story as pregate-sweep.yml: the
# app-user secrets live only in this repo's Actions secrets.
# The screener DROPS rows (dropped_filter) and drops are one-way, so every abort below
# fails CLOSED: any response we cannot read exactly stops the run rather than paging on.
name: applyy pre-screen drain

# Manual trigger ONLY, same ruling as pregate-sweep (Teja 2026-10-09): a run that drops
# rows must happen while someone watches the log, never on a cron.
on:
  workflow_dispatch:
    # The one input: rehearse without touching anything.
    inputs:
      # Prints the plan (URLs, caps, stop rules) and exits before sign-in, so the
      # dispatcher can check the run's shape without spending a single request.
      dry_count_only:
        # Shown in the Actions UI beside the checkbox.
        description: 'Print the plan only; no sign-in, no function calls'
        # A boolean input renders as a checkbox, so there is no free text to validate.
        type: boolean
        # Default is the real drain: the dispatcher opts INTO the rehearsal, not out of the run.
        default: false

# Read-only token. The job never checks out code or writes to the repo; it only talks
# to Supabase with its own credentials.
permissions:
  # Nothing else is granted; contents:read is the floor GitHub allows.
  contents: read

# One drain at a time: two concurrent drains would page the same queues and race each
# other's status advances, doubling the work for no gain.
concurrency:
  # A fixed key, because a drain has no per-row scope to key on.
  group: prescreen-drain
  # Never cancel mid-drain: a queued second run waits instead.
  cancel-in-progress: false

# A single job: the two stages are sequential by design (normalizer feeds the screener).
jobs:
  # Named for what it does, so the Actions list is readable.
  drain:
    # Same runner image as the other workflows. Its preinstalled Node (>= 20) has
    # global fetch, which is all this job needs: no checkout, no install, no third-party action.
    runs-on: ubuntu-latest
    # ~6 normalizer pages + ~15 screener pages at 180s/request worst case fit inside this;
    # the cap exists so a hung request cannot burn the monthly Actions minutes.
    timeout-minutes: 60
    # Steps run top to bottom; a non-zero exit stops the job.
    steps:
      # The whole drain in one step, so the secrets exist ONLY here. No `uses:` step runs
      # in this job at all, so no third-party action ever sees the password.
      - name: Drain discovered through normalizer, then deduped through screener
        # Node ESM from stdin. The quoted 'JS' delimiter stops bash expanding anything
        # inside, so the script text is exactly what is written here.
        run: |
          # Fail on any error, unset variable or failed pipe stage.
          set -euo pipefail
          # Node reads the module from stdin; --input-type=module enables top-level await.
          node --input-type=module <<'JS'
          // The two stages, declared up front so the plan log and the loop read ONE source.
          // limit: the function's own MAX_BATCH_SIZE (normalizer/index.ts:30, screener/index.ts:37);
          // asking for more is silently clamped, so these are the real page sizes.
          // pageCap: hard ceiling well above the live backlog (1,114 discovered / 200 = 6 pages;
          // 1,424 possible deduped / 100 = 15 pages) so a queue that never shrinks stops red.
          const STAGES = [
            // Stage 1: discovered -> deduped | dropped_duplicate.
            { name: 'normalizer', limit: 200, pageCap: 20 },
            // Stage 2: deduped -> passed_filters | dropped_filter | failed.
            { name: 'screener', limit: 100, pageCap: 40 },
          ];
          // Consecutive pages that process rows but advance none before the run stops red.
          // Exists for the screener's head-of-line trap: a row whose verdict write keeps
          // failing stays `deduped` (screener/index.ts:223-226) and, oldest-first, refills
          // every batch head — without this cap the loop would re-chew it forever.
          const STALL_CAP = 3;

          // Abort: one place that prints the reason and exits red. Never prints a secret,
          // because no caller passes one in.
          function abort(reason) {
            // ::error:: surfaces the reason on the run summary, not only in the log.
            console.log(`::error::ABORT: ${reason}`);
            // Non-zero so the run shows red, never green-with-nothing-done.
            process.exit(1);
          }

          // Reads an env var and refuses an empty one: a missing secret is an empty string
          // in Actions, and an empty URL or key must not become a request.
          function required(name) {
            // Read once.
            const value = process.env[name] ?? '';
            // Empty means the secret is not set; stop before any network call.
            if (value === '') abort(`missing ${name}`);
            // Non-empty from here on.
            return value;
          }

          // The rehearsal: the checkbox arrives as the string 'true' or 'false'.
          const dryCountOnly = process.env.DRY_COUNT_ONLY === 'true';
          // Origin only, trailing slash removed, so the URLs below never get a double slash.
          // Not required() in dry mode: the plan must print even before secrets exist.
          const base = (process.env.SUPABASE_URL ?? '').replace(/\/+$/, '');

          // The plan, printed on every run so the log always states the rules it ran under.
          for (const stage of STAGES) {
            // One line per stage: URL shape, page size and cap.
            console.log(`plan: POST ${base || '<SUPABASE_URL>'}/functions/v1/${stage.name}?limit=${stage.limit}, page cap ${stage.pageCap}`);
          }
          // The stop rules, verbatim, so a reader of the log can check the run against them.
          console.log(`plan: a stage ends when a page reports processed=0; ${STALL_CAP} consecutive pages with processed>0 but 0 rows advanced abort the run`);
          // The abort rules, likewise.
          console.log('plan: abort on non-2xx, non-JSON, missing/ill-typed fields, or a kill-switch halt (skipped_disabled / halted_by_kill_switch)');
          // The rehearsal ends here, before sign-in.
          if (dryCountOnly) {
            // Says plainly that nothing was called, so a green dry run is not mistaken for a drain.
            console.log('dry_count_only: plan printed; no sign-in, no function call made.');
            // Green: the rehearsal did what it was asked.
            process.exit(0);
          }

          // Real run: every credential must be present.
          const url = required('SUPABASE_URL');
          // The ANON key: all authority comes from the app user's JWT, never this key.
          const anonKey = required('SUPABASE_ANON_KEY');
          // The app user both functions' authorizeCaller() requires (_shared/db/gates.ts:45-73).
          const email = required('APPLYY_APP_USER_EMAIL');
          // Masked by GitHub; never logged here.
          const password = required('APPLYY_APP_USER_PASSWORD');
          // Refuse a non-https URL: the password must never travel in clear text.
          if (!url.startsWith('https://')) abort('SUPABASE_URL is not https');
          // The email is a secret too; GitHub masks registered secrets, this makes it explicit.
          console.log(`::add-mask::${email}`);
          // Per-request ceiling. Above the edge functions' own wall clock (~150s), so a
          // normal slow page finishes; a hung socket rejects and the run exits red.
          const REQUEST_TIMEOUT_MS = 180_000;

          // Sign in over the Auth REST endpoint: the same session pregate-sweep.yml gets,
          // without installing supabase-js.
          const authRes = await fetch(`${base}/auth/v1/token?grant_type=password`, {
            // GoTrue's password grant is a POST.
            method: 'POST',
            // The gateway wants the anon key; the body is JSON.
            headers: { apikey: anonKey, 'content-type': 'application/json' },
            // JSON.stringify escapes the values, so no credential can break the body.
            body: JSON.stringify({ email, password }),
            // A hung sign-in rejects instead of holding the job to timeout-minutes.
            signal: AbortSignal.timeout(REQUEST_TIMEOUT_MS),
          });
          // Read as text first: an error page must not crash the parse and hide the status.
          const authText = await authRes.text();
          // Only the status is logged; the body may echo the email.
          if (!authRes.ok) abort(`sign-in failed: HTTP ${authRes.status}`);
          // Parsed inside try: a soft-200 HTML page is a failure, not a session.
          let session;
          // JSON or abort.
          try { session = JSON.parse(authText); } catch { abort('sign-in returned non-JSON'); }
          // The token must be a non-empty string; anything else is not a session.
          const token = typeof session?.access_token === 'string' ? session.access_token : '';
          // Never continue unauthenticated.
          if (token === '') abort('sign-in returned no access_token');
          // Mask the JWT before anything could print it.
          console.log(`::add-mask::${token}`);

          // Requires a field to be a non-negative integer, named in the abort so the
          // operator sees WHICH field broke the shape (CLAUDE.md §6: validate the shape,
          // never ask a lenient parser whether it gave up).
          function requireCount(body, key, stage) {
            // Number.isInteger refuses NaN, strings and floats in one check.
            if (!Number.isInteger(body[key]) || body[key] < 0) abort(`${stage}: ${key} is missing or not a non-negative integer`);
            // Proven; the caller may read it.
            return body[key];
          }

          // Strict shape check of one page. Returns {processed, advanced, errored, summary}
          // or aborts. advanced = rows that LEFT the stage's input status this page; a page
          // where processed > 0 but advanced === 0 re-reads the same rows next time.
          function readPage(stage, httpStatus, text) {
            // Any non-2xx stops the run: 400 bad params, 401/403 auth, 500, 503.
            if (httpStatus < 200 || httpStatus > 299) abort(`${stage}: HTTP ${httpStatus}: ${text.slice(0, 200)}`);
            // Parsed or abort: a platform timeout page is not a drain result.
            let body;
            // JSON or abort.
            try { body = JSON.parse(text); } catch { abort(`${stage}: non-JSON response: ${text.slice(0, 120)}`); }
            // Must be an object, not null, an array or a scalar.
            if (body === null || typeof body !== 'object' || Array.isArray(body)) abort(`${stage}: body is not an object`);
            // The kill switch answers 200 with no drain fields (normalizer/index.ts:163,
            // screener/index.ts:130-134); named BEFORE the shape check so the log says WHY.
            if (body.status === 'skipped_disabled' || body.status === 'halted_by_kill_switch') {
              // A deliberate halt is an operator decision, not a drained queue: stop red.
              abort(`${stage}: pipeline is disabled (${body.status})`);
            }
            // Both functions' every remaining 200 carries processed (normalizer/index.ts:245,
            // :445; screener/index.ts:171, :276), so this is the one universal count.
            const processed = requireCount(body, 'processed', stage);
            // Per-stage advancement fields; the empty-queue (processed=0) responses omit
            // some fields (normalizer omits `errors`, index.ts:241-252; screener omits
            // `failed`, index.ts:168-174), so each is required only when rows were read.
            let advanced = 0;
            // Rows that errored in place this page (they stay at the input status).
            let errored = 0;
            // Normalizer page: advanced = deduped + dropped_duplicate (index.ts:447-449).
            if (stage === 'normalizer') {
              // Both counts are present even on the empty-queue shape (index.ts:246-249).
              advanced = requireCount(body, 'deduped', stage) + requireCount(body, 'dropped_duplicate', stage);
              // `errors` exists only on the full-run shape (index.ts:451); absent is legal
              // ONLY for an empty page — a non-empty page missing it fails the shape check.
              errored = processed === 0 && body.errors === undefined ? 0 : requireCount(body, 'errors', stage);
            // Screener page: advanced = passed + dropped ONLY (index.ts:277-278). `failed`
            // is NOT counted: it mixes rows moved to status `failed` (index.ts:192-194)
            // with refused writes that STAY `deduped` (index.ts:224-226), so counting it
            // would let a stuck queue head look like progress. Same reading the screener's
            // own runStatus uses ("nothing moved" = neither passed nor dropped, :239-241).
            // Cost: a page of only missing_job_record rows counts as stalled — a false
            // abort is safe (rerun), a false "progress" would spin to the page cap.
            } else {
              // Present on both screener shapes (index.ts:172-173, :277-278).
              advanced = requireCount(body, 'passed', stage) + requireCount(body, 'dropped', stage);
              // `failed` exists only on the full-run shape (index.ts:279); same empty-page rule.
              errored = processed === 0 && body.failed === undefined ? 0 : requireCount(body, 'failed', stage);
            }
            // Shape is proven; the caller may now read the derived counts.
            return { processed, advanced, errored, summary: body.status ?? 'ok' };
          }

          // Grand totals for the final summary line.
          let totalAdvanced = 0;
          // Rows read across the whole run, for the same line.
          let totalProcessed = 0;

          // Stages run strictly in order: the normalizer's output IS the screener's input.
          for (const stage of STAGES) {
            // Pages spent in this stage; the stage's own cap bounds them.
            let pages = 0;
            // Consecutive stalled pages (processed > 0, advanced 0); reset by any progress.
            let stalled = 0;

            // Page loop: each page re-reads the head of the queue, because advanced rows
            // leave the input status — there is no cursor to carry (unlike pregate-sweep).
            while (true) {
              // Hard cap: stop red rather than spin on a queue that never ends.
              if (pages >= stage.pageCap) abort(`${stage.name}: page cap ${stage.pageCap} reached before the queue emptied`);
              // Counted before the request so a failing request still counts.
              pages += 1;
              // The page request: empty POST, app-user JWT plus anon key, limit in the
              // query string because neither function reads a body (normalizer/index.ts:99,
              // screener/index.ts:75).
              const res = await fetch(`${base}/functions/v1/${stage.name}?limit=${stage.limit}`, {
                // Both functions treat every non-OPTIONS method alike; POST matches the other callers.
                method: 'POST',
                // The token is masked; these headers are never logged.
                headers: { authorization: `Bearer ${token}`, apikey: anonKey },
                // A rejected (timed-out) request throws at top level: Node exits 1, fail closed.
                signal: AbortSignal.timeout(REQUEST_TIMEOUT_MS),
              });
              // Text first, so readPage can quote a non-JSON body.
              const page = readPage(stage.name, res.status, await res.text());

              // Run totals for the summary.
              totalProcessed += page.processed;
              // Same.
              totalAdvanced += page.advanced;
              // One line per page in the log: counts only, never a secret.
              console.log(`${stage.name} page ${pages}: processed=${page.processed} advanced=${page.advanced} errored=${page.errored} status=${page.summary}`);

              // The queue is empty: this stage is done (normalizer/index.ts:241-252,
              // screener/index.ts:168-174 both answer processed=0 exactly then).
              if (page.processed === 0) break;
              // Progress check: a page that read rows but moved none would re-read the
              // same head next time (no cursor exists). Count it toward the stall cap.
              if (page.advanced === 0) {
                // One more stalled page.
                stalled += 1;
                // Cap reached: the head of the queue is stuck; a human must look at it.
                if (stalled >= STALL_CAP) abort(`${stage.name}: ${STALL_CAP} consecutive pages advanced 0 rows; head of queue is stuck`);
              } else {
                // Any progress resets the window: only CONSECUTIVE stalls count.
                stalled = 0;
              }
            }
            // Stage boundary line, so the log shows where the normalizer ended.
            console.log(`${stage.name}: queue drained in ${pages} page(s)`);
          }

          // The summary line the orchestrator reads.
          console.log(`CLEAN: both queues drained; processed=${totalProcessed} advanced=${totalAdvanced}`);
          // Green.
          process.exit(0);
          JS
        # Credentials exist ONLY for this step: the same secret names pregate-sweep.yml uses.
        env:
          # The rehearsal flag, passed through env, never interpolated into the script.
          DRY_COUNT_ONLY: ${{ inputs.dry_count_only }}
          # Public project URL, stored as a secret for parity with apply.yml.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # The ANON key: authority comes from the app user's JWT.
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # The app user the functions authorize.
          APPLYY_APP_USER_EMAIL: ${{ secrets.APPLYY_APP_USER_EMAIL }}
          # Masked in logs by GitHub; never echoed by this workflow.
          APPLYY_APP_USER_PASSWORD: ${{ secrets.APPLYY_APP_USER_PASSWORD }}
