# Runs scout-ats in its liveness-only mode once a day (2026-11-18, D4 of
# docs/audit/2026-11-18-discovery-channels.md). Queue liveness (a posting in awaiting_approval /
# approved that closed on its board) and feed liveness (a no-ATS posting whose page now says 404/410)
# lived only inside scout-ats, and scout-ats ran only when Teja clicked Scan; the scheduled scout
# (scout.yml, worker/src/cli/scout.ts) has neither check. So a dead posting stayed approvable, and
# after approval appliable, until someone clicked. Teja's standing ruling (2026-10-24, "automate,
# don't hand-dispatch"): the system runs per-row work on a schedule.
# `?mode=liveness` does NOT scan: no jobs/applications upserts, no screener, no watchlist telemetry.
# It reads the listing only of the boards that hold queue rows (queue liveness needs that listing as
# its first proof), confirms absent rows on their posting endpoints, then probes the feed rows. Its
# only writes are jobs.disappeared_at, the reason notes in application_events and its agent_runs row.
# Same credential story as satellites.yml: the app-user secrets live only in this repo's Actions
# secrets, and scout-ats's createAuthorizedAppUserClient() demands that user's JWT.
name: applyy scout-ats liveness (daily)

on:
  # Daily at 01:41 UTC = 07:11 IST: before apply.yml (02:30 UTC, which really starts ~08:00-10:00
  # UTC, CLAUDE.md §4), so a posting that closed overnight is retired before the worker submits
  # approved rows, and before Teja's morning approvals. Odd minute: GitHub delays top-of-hour cron most.
  schedule:
    - cron: '41 1 * * *'
  # By hand, for a first run after the scout-ats deploy or a re-run after a failure.
  workflow_dispatch:

# No GitHub API use at all: no checkout, no artifact, no comment. An empty map grants the job
# token nothing, which is the least privilege there is.
permissions: {}

# One sweep at a time: two overlapping sweeps would confirm the same rows twice and spend the
# posting endpoints' patience for nothing.
concurrency:
  # A fixed key: the sweep has no per-row scope to key on.
  group: applyy-scout-ats-liveness
  # Never cancel mid-run: a queued second run waits and then re-reads what is still live.
  cancel-in-progress: false

jobs:
  # Named for what it does, so the Actions list is readable.
  liveness:
    # Same runner image as the other workflows. Its preinstalled Node has global fetch, which is
    # all this job needs: no checkout, no install, no third-party action.
    runs-on: ubuntu-latest
    # One call at a 180 s ceiling plus the sign-in; the cap stops a hung socket burning Actions minutes.
    timeout-minutes: 10
    # Steps run top to bottom; a non-zero exit stops the job.
    steps:
      # The whole run in one step, so the secrets exist ONLY here. No `uses:` step runs in this
      # job at all, so no third-party action ever sees the password.
      - name: Sign in as the app user and run the scout-ats liveness sweep
        # Node ESM from stdin. The quoted 'JS' delimiter stops bash expanding anything inside,
        # so the script text is exactly what is written here.
        run: |
          # Fail on any error, unset variable or failed pipe stage.
          set -euo pipefail
          # Node reads the module from stdin; --input-type=module enables top-level await.
          node --input-type=module <<'JS'
          // Abort: prints the reason and exits red. Never passed a secret.
          function abort(reason) {
            // ::error:: surfaces the reason on the run summary, not only in the log.
            console.log(`::error::ABORT: ${reason}`);
            // Non-zero so the run shows red, never green-with-nothing-done.
            process.exit(1);
          }

          // Reads an env var and refuses an empty one: a missing secret is an empty string in
          // Actions, and an empty URL, key or credential must never become a request.
          function required(name) {
            // Read once.
            const value = process.env[name] ?? '';
            // Empty means the secret is not set; stop before any network call.
            if (value === '') abort(`missing ${name}`);
            // Non-empty from here on.
            return value;
          }

          // Every credential must be present; there is no unauthenticated mode.
          const url = required('SUPABASE_URL');
          // The ANON key: all authority comes from the app user's JWT, never this key.
          const anonKey = required('SUPABASE_ANON_KEY');
          // The app user scout-ats authorizes (_shared/db/gates.ts).
          const email = required('APPLYY_APP_USER_EMAIL');
          // Masked by GitHub; never logged here.
          const password = required('APPLYY_APP_USER_PASSWORD');
          // Refuse a non-https URL: the password must never travel in clear text.
          if (!url.startsWith('https://')) abort('SUPABASE_URL is not https');
          // Origin only, trailing slash removed, so the URLs below never get a double slash.
          const base = url.replace(/\/+$/, '');
          // The email is a secret too; GitHub masks registered secrets, this makes it explicit.
          console.log(`::add-mask::${email}`);
          // Per-request ceiling, above the edge function's own ~150 s wall clock, so a slow sweep
          // finishes and a hung socket rejects.
          const REQUEST_TIMEOUT_MS = 180_000;
          // The one call, printed so the log states what this run was allowed to do.
          const target = `${base}/functions/v1/scout-ats?mode=liveness`;
          // The plan.
          console.log(`plan: POST ${target}`);

          // Sign in over the Auth REST endpoint, exactly as satellites.yml does, so no supabase-js
          // install is needed.
          const authRes = await fetch(`${base}/auth/v1/token?grant_type=password`, {
            // GoTrue's password grant is a POST.
            method: 'POST',
            // The gateway wants the anon key; the body is JSON.
            headers: { apikey: anonKey, 'content-type': 'application/json' },
            // JSON.stringify escapes the values, so no credential can break the body.
            body: JSON.stringify({ email, password }),
            // A hung sign-in rejects instead of holding the job to timeout-minutes.
            signal: AbortSignal.timeout(REQUEST_TIMEOUT_MS),
          });
          // Read as text first: an error page must not crash the parse and hide the status.
          const authText = await authRes.text();
          // Only the status is logged; the body may echo the email.
          if (!authRes.ok) abort(`sign-in failed: HTTP ${authRes.status}`);
          // Parsed inside try: a soft-200 HTML page is a failure, not a session.
          let session;
          // JSON or abort.
          try { session = JSON.parse(authText); } catch { abort('sign-in returned non-JSON'); }
          // The token must be a non-empty string; anything else is not a session.
          const token = typeof session?.access_token === 'string' ? session.access_token : '';
          // Never continue unauthenticated.
          if (token === '') abort('sign-in returned no access_token');
          // Mask the JWT before anything could print it.
          console.log(`::add-mask::${token}`);

          // The sweep. An empty POST: scout-ats reads only the query string, never a body.
          let res;
          // A network error or timeout is a red run, named.
          try {
            // POST like every other caller of the function.
            res = await fetch(target, {
              // The function's only method besides OPTIONS.
              method: 'POST',
              // The app user's JWT for the caller gate, plus the anon key for the gateway.
              headers: { authorization: `Bearer ${token}`, apikey: anonKey },
              // Bounded, so a hung function cannot eat the job's timeout.
              signal: AbortSignal.timeout(REQUEST_TIMEOUT_MS),
            });
          } catch (err) {
            // Nothing secret is in a fetch error.
            abort(`request failed: ${err instanceof Error ? err.message : String(err)}`);
          }
          // Read once, as text, so a non-JSON page can be quoted.
          const text = await res.text();
          // Parsed, or null for a non-JSON page.
          let body = null;
          // A soft-200 HTML page must not read as a sweep.
          try { body = JSON.parse(text); } catch { body = null; }

          // A deliberate halt: the kill switch is off. Green, because the system was told to stop.
          if (res.ok && body?.status === 'halted_by_kill_switch') {
            // Said plainly, so a green run is not mistaken for a sweep.
            console.log('HALTED: system_settings.system_enabled is false; no liveness ran');
            // Done.
            process.exit(0);
          }
          // THE POSITIVE SHAPE (CLAUDE.md §6): a sweep answers mode 'liveness' with numeric counts. A
          // scout-ats deployed before this mode ignores ?mode and answers a full scan (no `mode`
          // field), which must read as red, not as a sweep that found nothing.
          const shaped = body !== null && body.mode === 'liveness' && Number.isInteger(body.queue_rows) && Number.isInteger(body.queue_closed) && Number.isInteger(body.feed_liveness?.closed);
          // Non-2xx: the sweep failed (every board failed, or the queue read failed or was truncated).
          if (!res.ok) abort(`scout-ats answered HTTP ${res.status}: ${text.slice(0, 400)}`);
          // 2xx in the wrong shape.
          if (!shaped) abort(`scout-ats answered 2xx without the liveness shape (is the mode deployed?): ${text.slice(0, 400)}`);
          // The day's numbers, one line, for the run summary.
          console.log(`CLEAN: queue rows ${body.queue_rows} (unmatched ${body.queue_unmatched}, ambiguous ${body.queue_ambiguous}), boards read ${body.boards_read}, queue closed ${body.queue_closed}, feed probed ${body.feed_liveness.probed}, feed closed ${body.feed_liveness.closed}`);
          // Per-board detail, so a refused or failed board is visible without a re-run.
          for (const r of body.results ?? []) console.log(`board ${r.board}: ${r.status}${r.reason ? ` (${r.reason})` : ''}, queue closed ${r.queue_closed}`);
          JS
        # Credentials exist ONLY for this step: the same secret names satellites.yml uses.
        env:
          # Public project URL, stored as a secret for parity with apply.yml.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # The ANON key: authority comes from the app user's JWT.
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # The app user scout-ats authorizes.
          APPLYY_APP_USER_EMAIL: ${{ secrets.APPLYY_APP_USER_EMAIL }}
          # Masked in logs by GitHub; never echoed by this workflow.
          APPLYY_APP_USER_PASSWORD: ${{ secrets.APPLYY_APP_USER_PASSWORD }}
