# applyy — scheduled ATS scout (job discovery).
#
# Regularly polls registered company career boards (Greenhouse, Lever, Ashby,
# SmartRecruiters) from public.company_watchlist, deduplicates postings by canonical
# fingerprint into public.jobs, and screens each new posting at insert, so its
# public.applications row is born at 'passed_filters' or 'dropped_filter' ('discovered'
# only when the screener cannot load). Corrected 2026-11-01: this said 'discovered'.
#
# Lightweight: requires NO Playwright or Chromium download. Not fast any more: each run
# reads every enabled board, measured 9-12 minutes (2026-10-29..11-01, 16,772 postings),
# where this once said ~10-15 seconds. The 15-minute job timeout below is the ceiling to
# watch as the watchlist grows.
name: applyy scout (ats discovery)

on:
  schedule:
    # Twice a day, 00:17 and 12:17 UTC (05:47 and 17:47 IST). Teja ruled 2026-11-01 that
    # two runs are enough (it was every 6 hours): each run uses ~10 Actions minutes of this
    # private repo's monthly quota, so this halves scout's share. 00:17 UTC collects the US
    # working day for the Indian morning review; 12:17 UTC collects the Indian and European
    # day. Minute 17, not 0: GitHub delays, and under heavy load drops, scheduled runs at
    # the top of the hour; runs here started 3-6 hours late (measured 2026-10-29..11-01).
    # Change together with what assumes this cadence: the Health threshold
    # (apps/web/src/data/agentFreshness.ts) and the scan panel's "twice a day"
    # (apps/web/src/features/pipeline/DiscoveryModal.tsx).
    - cron: '17 0,12 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Set to "true" to discover jobs even if system_settings.system_enabled is false'
        required: false
        # 'false' so an operator who clicks straight through respects the kill
        # switch; overriding it must be a deliberate typed choice.
        default: 'false'

permissions:
  contents: read

concurrency:
  group: applyy-scout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # NO job-level env (moved 2026-10-05): job env reaches every action and every
    # dependency install script. Only "Run Scout ATS Discovery" reads these
    # (worker/src/cli/scout.ts:48-52), so they are scoped to that step below.

    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.25.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Scout ATS Discovery
        run: pnpm --filter '@applyy/worker' run scout
        # Step-scoped: the only reader of these (scout.ts:48-52).
        env:
          # Supabase project URL; secret so the project ref is not advertised.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # Public-by-design anon key; authority comes from the user JWT below.
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # The ordinary app user the scout signs in as, so RLS applies.
          APPLYY_APP_USER_EMAIL: ${{ secrets.APPLYY_APP_USER_EMAIL }}
          # Its password: the reason this block is step-scoped at all.
          APPLYY_APP_USER_PASSWORD: ${{ secrets.APPLYY_APP_USER_PASSWORD }}
          # 'true' ONLY for a manual run that explicitly asked for it. The old form,
          # `inputs.force == 'false' && 'false' || 'true'`, resolved to 'true' on
          # every SCHEDULED run (a schedule has no inputs, so the comparison failed)
          # and the kill switch never stopped the cron (worker/src/cli/scout.ts).
          # Written as an allowlist of one case, so anything else fails closed.
          SCOUT_FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force == 'true' && 'true' || 'false' }}
