# Runs the five SATELLITE agents once a day: skill-gap, follow-up, cover-letter,
# interview-prep and referral. Exists because none of them had a caller (2026-11-01 wiring
# audit, W22): no functions.invoke, no workflow, no pg_cron, and zero agent_runs rows ever,
# while their pages promised the drafts "will appear". Teja's standing ruling (2026-10-24,
# "automate, don't hand-dispatch"): per-row work is started by the system on a schedule,
# never by an agent loop or a human click.
# Each function picks its own eligible rows, takes its own kill switch and its own batch
# cap, and writes only side artifacts (reports, drafts, letters, packs). None of them moves
# an application's status, so a run here can never advance, drop or submit anything.
# Same credential story as prescreen-drain.yml: the app-user secrets live only in this
# repo's Actions secrets, and the functions' authorizeCaller() demands that user's JWT.
name: applyy satellites (daily)

on:
  # Daily at 13:23 UTC = 18:53 IST: after apply.yml (02:30 UTC, which really starts
  # ~08:00-10:00 UTC, CLAUDE.md §4) and apply-kit.yml's 12:00 UTC backstop, so the day's
  # status changes have landed before the drafts are read. Odd minute: GitHub delays
  # top-of-hour cron the most.
  schedule:
    - cron: '23 13 * * *'
  # By hand, for a first run after a deploy or a re-run after a failure. A dispatch is a
  # deliberate human act, so it runs whether or not the schedule is switched on below.
  workflow_dispatch:

# No GitHub API use at all: no checkout, no artifact, no comment. An empty map grants the
# job token nothing, which is the least privilege there is.
permissions: {}

# One satellites run at a time: two overlapping runs would read the same eligible rows
# before either wrote, and draft (and pay Gemini for) the same row twice.
concurrency:
  # A fixed key: the run has no per-row scope to key on.
  group: applyy-satellites
  # Never cancel mid-run: a queued second run waits and then re-reads what is still due.
  cancel-in-progress: false

jobs:
  # Named for what it does, so the Actions list is readable.
  satellites:
    # SCHEDULE GUARD. A scheduled run proceeds only when the repository variable
    # APPLYY_SATELLITES_LIVE is exactly 'true'; absent or anything else skips the job
    # (grey, not red). It exists because the deployed copies of these five functions
    # predate the Gemini fix 4327531 and skill-gap's caller gate (W14): the orchestrator
    # redeploys all five FIRST, then sets the variable. Same idea as apply.yml's
    # APPLYY_CRON_LIVE. A manual dispatch ignores it, because a human chose to run it.
    if: github.event_name == 'workflow_dispatch' || vars.APPLYY_SATELLITES_LIVE == 'true'
    # Same runner image as the other workflows. Its preinstalled Node has global fetch,
    # which is all this job needs: no checkout, no install, no third-party action.
    runs-on: ubuntu-latest
    # Five sequential calls at a 180s ceiling each is 15 minutes worst case; the cap stops a
    # hung socket from burning the monthly Actions minutes.
    timeout-minutes: 20
    # Steps run top to bottom; a non-zero exit stops the job.
    steps:
      # The whole run in one step, so the secrets exist ONLY here. No `uses:` step runs in
      # this job at all, so no third-party action ever sees the password.
      - name: Sign in as the app user and invoke the five satellite functions
        # Node ESM from stdin. The quoted 'JS' delimiter stops bash expanding anything
        # inside, so the script text is exactly what is written here.
        run: |
          # Fail on any error, unset variable or failed pipe stage.
          set -euo pipefail
          # Node reads the module from stdin; --input-type=module enables top-level await.
          node --input-type=module <<'JS'
          // The five calls, declared up front so the plan log and the loop read ONE source.
          // query: the batch cap each function honours. Conservative on purpose: every
          // drafted row is one Gemini call against the shared key pool the pipeline also uses.
          const SATELLITES = [
            // Pure CPU, no Gemini. Takes no parameter; scans up to 200 scored/applied rows itself.
            { name: 'skill-gap', query: '' },
            // Takes no parameter: its batch is fixed at 5 in code (follow-up/index.ts BATCH_SIZE).
            { name: 'follow-up', query: '' },
            // ?limit honoured (default 10, max 25); 5 keeps a backlog from spending 25 calls a day.
            { name: 'cover-letter', query: '?limit=5' },
            // ?limit honoured (default 5, max 10); stated explicitly so a code default change cannot raise spend.
            { name: 'interview-prep', query: '?limit=5' },
            // ?limit honoured (default 10, max 25); passed_filters is a large backlog, so 5 a day.
            { name: 'referral', query: '?limit=5' },
          ];
          // A deliberate halt is reported this way by the five (skill-gap since 2026-11-01).
          const HALTS = new Set(['skipped_disabled', 'halted_by_kill_switch']);

          // Abort: prints the reason and exits red. Used only before any function is called,
          // and never passed a secret.
          function abort(reason) {
            // ::error:: surfaces the reason on the run summary, not only in the log.
            console.log(`::error::ABORT: ${reason}`);
            // Non-zero so the run shows red, never green-with-nothing-done.
            process.exit(1);
          }

          // Reads an env var and refuses an empty one: a missing secret is an empty string in
          // Actions, and an empty URL, key or credential must never become a request.
          function required(name) {
            // Read once.
            const value = process.env[name] ?? '';
            // Empty means the secret is not set; stop before any network call.
            if (value === '') abort(`missing ${name}`);
            // Non-empty from here on.
            return value;
          }

          // Every credential must be present; there is no unauthenticated mode.
          const url = required('SUPABASE_URL');
          // The ANON key: all authority comes from the app user's JWT, never this key.
          const anonKey = required('SUPABASE_ANON_KEY');
          // The app user every satellite's authorizeCaller() requires (_shared/db/gates.ts).
          const email = required('APPLYY_APP_USER_EMAIL');
          // Masked by GitHub; never logged here.
          const password = required('APPLYY_APP_USER_PASSWORD');
          // Refuse a non-https URL: the password must never travel in clear text.
          if (!url.startsWith('https://')) abort('SUPABASE_URL is not https');
          // Origin only, trailing slash removed, so the URLs below never get a double slash.
          const base = url.replace(/\/+$/, '');
          // The email is a secret too; GitHub masks registered secrets, this makes it explicit.
          console.log(`::add-mask::${email}`);
          // Per-request ceiling, above the edge functions' own ~150s wall clock, so a slow
          // run finishes and a hung socket rejects.
          const REQUEST_TIMEOUT_MS = 180_000;

          // The plan, printed on every run so the log states what this run was allowed to do.
          for (const s of SATELLITES) console.log(`plan: POST ${base}/functions/v1/${s.name}${s.query}`);

          // Sign in over the Auth REST endpoint, exactly as prescreen-drain.yml does, so no
          // supabase-js install is needed.
          const authRes = await fetch(`${base}/auth/v1/token?grant_type=password`, {
            // GoTrue's password grant is a POST.
            method: 'POST',
            // The gateway wants the anon key; the body is JSON.
            headers: { apikey: anonKey, 'content-type': 'application/json' },
            // JSON.stringify escapes the values, so no credential can break the body.
            body: JSON.stringify({ email, password }),
            // A hung sign-in rejects instead of holding the job to timeout-minutes.
            signal: AbortSignal.timeout(REQUEST_TIMEOUT_MS),
          });
          // Read as text first: an error page must not crash the parse and hide the status.
          const authText = await authRes.text();
          // Only the status is logged; the body may echo the email.
          if (!authRes.ok) abort(`sign-in failed: HTTP ${authRes.status}`);
          // Parsed inside try: a soft-200 HTML page is a failure, not a session.
          let session;
          // JSON or abort.
          try { session = JSON.parse(authText); } catch { abort('sign-in returned non-JSON'); }
          // The token must be a non-empty string; anything else is not a session.
          const token = typeof session?.access_token === 'string' ? session.access_token : '';
          // Never continue unauthenticated.
          if (token === '') abort('sign-in returned no access_token');
          // Mask the JWT before anything could print it.
          console.log(`::add-mask::${token}`);

          // Calls one function and returns 'ok', 'halt' or 'fail'. Never throws, so one broken
          // satellite cannot stop the other four from running.
          async function invoke(s) {
            // Text of the response, kept for the failure line.
            let text = '';
            // HTTP status, or 0 when no response arrived.
            let status = 0;
            // A network error or timeout is a failed call, not a crash of the whole run.
            try {
              // Empty POST: all five read only the query string, never a body.
              const res = await fetch(`${base}/functions/v1/${s.name}${s.query}`, {
                // Every caller of these functions uses POST.
                method: 'POST',
                // The app user's JWT for authorizeCaller(), plus the anon key for the gateway.
                headers: { authorization: `Bearer ${token}`, apikey: anonKey },
                // Bounded, so one hung function cannot eat the job's timeout.
                signal: AbortSignal.timeout(REQUEST_TIMEOUT_MS),
              });
              // Status first, then the body as text so a non-JSON page can be quoted.
              status = res.status;
              // Read once.
              text = await res.text();
            } catch (err) {
              // Named in the log; nothing secret is in a fetch error.
              console.log(`::error::${s.name}: request failed: ${err instanceof Error ? err.message : String(err)}`);
              // Counted as a failure.
              return 'fail';
            }
            // Any non-2xx is a failure: 401/403 auth, 409 no master profile, 500, 503.
            if (status < 200 || status > 299) {
              // Capped quote of the JSON error code; these bodies carry codes, not row data.
              console.log(`::error::${s.name}: HTTP ${status}: ${text.slice(0, 200)}`);
              // Counted as a failure.
              return 'fail';
            }
            // Parsed or failed: a platform timeout page is not a result (CLAUDE.md §6).
            let body;
            // JSON or fail.
            try { body = JSON.parse(text); } catch {
              // Quoted, capped, so the cause is visible.
              console.log(`::error::${s.name}: non-JSON 2xx response: ${text.slice(0, 120)}`);
              // Counted as a failure.
              return 'fail';
            }
            // Must be a plain object; null, an array or a scalar is not a run summary.
            if (body === null || typeof body !== 'object' || Array.isArray(body)) {
              // Named shape failure.
              console.log(`::error::${s.name}: 2xx body is not an object`);
              // Counted as a failure.
              return 'fail';
            }
            // The kill switch is off: the system did what it was told. A warning, not red.
            if (HALTS.has(body.status)) {
              // Visible on the run summary so a halted day is not mistaken for an idle one.
              console.log(`::warning::${s.name}: halted by the kill switch (${body.status})`);
              // Not a failure.
              return 'halt';
            }
            // Counts only, never row content (warnings can quote company names, and Actions
            // logs can be public): the fields each function reports when present.
            const counts = ['status', 'aggregatedSkills', 'processed', 'rows_in', 'drafted', 'generated', 'failed', 'gemini_calls']
              // Only the fields this function actually returned.
              .filter((k) => body[k] !== undefined)
              // key=value, one line.
              .map((k) => `${k}=${typeof body[k] === 'object' ? JSON.stringify(body[k]) : body[k]}`);
            // Per-row problem counts (follow-up `failures`, cover-letter `failures`, the others `warnings`).
            for (const k of ['failures', 'warnings']) if (Array.isArray(body[k])) counts.push(`${k}=${body[k].length}`);
            // The function's own honest verdict: there was work and none of it landed. The
            // reasons are in agent_runs.error_detail (the health page does not list the five
            // satellites yet, so read that column directly).
            if (body.status === 'failed') {
              // Counts in this log; the detail stays in the database.
              console.log(`::error::${s.name}: run failed: ${counts.join(' ')}`);
              // Counted as a failure.
              return 'fail';
            }
            // One summary line per function.
            console.log(`${s.name}: ok ${counts.join(' ')}`);
            // Ran.
            return 'ok';
          }

          // Names of the functions whose call failed, for the closing line.
          const failed = [];
          // Sequential: the Gemini spenders share one key pool, so they never run at once.
          for (const s of SATELLITES) {
            // One call; never throws.
            const verdict = await invoke(s);
            // Remember failures; keep going so the others still run today.
            if (verdict === 'fail') failed.push(s.name);
          }
          // Any failure turns the run red, AFTER every satellite had its chance.
          if (failed.length > 0) {
            // The closing line names exactly which ones.
            console.log(`::error::satellites failed: ${failed.join(', ')}`);
            // Red.
            process.exit(1);
          }
          // Green: every satellite ran or was deliberately halted.
          console.log('CLEAN: all five satellites ran (or were halted by the kill switch)');
          JS
        # Credentials exist ONLY for this step: the same secret names prescreen-drain.yml uses.
        env:
          # Public project URL, stored as a secret for parity with apply.yml.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # The ANON key: authority comes from the app user's JWT.
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # The app user the functions authorize.
          APPLYY_APP_USER_EMAIL: ${{ secrets.APPLYY_APP_USER_EMAIL }}
          # Masked in logs by GitHub; never echoed by this workflow.
          APPLYY_APP_USER_PASSWORD: ${{ secrets.APPLYY_APP_USER_PASSWORD }}
