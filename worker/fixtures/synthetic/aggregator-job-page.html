<!doctype html>
<!-- 2026-11-09: the shape of what the apply kit and the applier opened for Supabase 8f20a220, a job
     aggregator's (jobicy.com) page for an OPEN posting. HTTP 200, a JobPosting whose validThrough is in
     the future, an "Apply for this job" link that leads off-site, and only two controls: the site's
     search box and a dark-mode toggle. The kit called it posting_closed (no email field) and the applier's
     dry run called it wouldSubmit=true. Synthetic: the shape, not a copy. -->
<html lang="en">
<head>
  <!-- Plain document; the kit only reads controls. -->
  <meta charset="utf-8">
  <!-- Titled like the aggregator's job page, which names a real, open role. -->
  <title>Remote SDK Engineer - Python at Example Co - Job Board</title>
  <!-- The structured data an aggregator publishes: the posting is open until a date far in the future. -->
  <script type="application/ld+json">{"@context":"https://schema.org","@type":"JobPosting","title":"SDK Engineer - Python","datePosted":"2026-11-06T16:00:04+00:00","validThrough":"2099-12-06T23:59:59+00:00"}</script>
</head>
<body>
  <!-- The site header's search bar: the first of the page's two controls. -->
  <form role="search">
    <!-- Labelled exactly as the live page labels it. -->
    <label for="q">Job title, company or skill</label>
    <!-- A type=text search box, which the extractor reads as a text field. -->
    <input id="q" name="q" type="text">
  </form>
  <!-- The theme switch: the second control, a checkbox with nothing to do with applying. -->
  <label><input type="checkbox" name="theme"> Dark mode</label>
  <!-- The posting itself: open, with an apply link that leaves the aggregator. -->
  <main>
    <!-- The role, as the aggregator shows it. -->
    <h1>SDK Engineer - Python</h1>
    <!-- The only way to apply: a link, not a form. -->
    <a href="#job-application">Apply for this job</a>
  </main>
</body>
</html>
