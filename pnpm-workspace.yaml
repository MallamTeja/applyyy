# Workspace root for the applyy monorepo.
# Every stream owned by a peer session resolves through this file, so it must
# exist before any peer runs `pnpm install` — otherwise each peer creates its
# own broken package root and the installs diverge.
packages:
  # Shared libraries. shared-types is owned by the schema stream and is the
  # contract every other stream builds against; resume-template must import
  # into BOTH Deno (Supabase Edge Functions) and Node (the Playwright worker),
  # which is the known risk flagged in PROJECT_PLAN.md §7.
  - "packages/*"
  # The React + TypeScript dashboard deployed to Vercel as a static frontend.
  - "apps/*"
  # The Playwright applier that runs on GitHub Actions. Singular, not a glob,
  # because there is exactly one worker and a glob would invite a second.
  - "worker"

# ONE TypeScript version for the whole workspace, forced regardless of what each
# package declares. Enforced here rather than asked of four peers because the
# floor is a consequence of MY choice: tsconfig.base.json sets
# `erasableSyntaxOnly`, which TypeScript only understands from 5.8 — below that
# tsc fails with "TS5023: Unknown compiler option", which is what apps/web hit
# on 5.7.2.
#
# The audit that prompted this found three different ranges across four
# packages, and the dangerous one was NOT the broken one. packages/shared-types
# declared ^5.6.0 and passed only because the caret floated up to 5.9.x -- fine
# by luck, not by intent. A dependency that works because a range happens to
# float breaks on a LOCKFILE REFRESH rather than on a code change, so it breaks
# for someone who edited nothing, which is the hardest kind of break to diagnose.
# An override converts that into one number in one place.
overrides:
  typescript: "5.9.3"
  # Security pin, not a compatibility one: Dependabot #47 / GHSA-68fv-2mgg-jv7q
  # (high, event-loop DoS via indexed source-map section offsets) affects
  # >=1.0.0 <1.2.2. It arrives transitively via postcss (vite's CSS pipeline),
  # whose own range already admits 1.2.2, so forcing the first patched version
  # here closes the alert without touching any package.json. Exact, not a
  # caret, for the same reason as typescript above: a range that floats changes
  # on a lockfile refresh nobody asked for.
  source-map-js: "1.2.2"

# Dependencies permitted to run their install/build scripts. pnpm 11 blocks all
# of them by default and the block is FATAL, not a warning: `pnpm --filter X run
# test` performs an implicit dependency-status install first, so every script in
# the workspace exits 1 with ERR_PNPM_IGNORED_BUILDS before the script itself is
# reached. Two peers hit this independently and one was working around it by
# calling node_modules/.bin/vitest directly -- a workaround that would have
# survived into CI and failed there instead.
onlyBuiltDependencies:
  # esbuild ships prebuilt platform binaries and its postinstall selects the
  # right one. It is not a direct dependency of anything here; it arrives via
  # vitest and vite, which is why the failure hits worker and apps/web alike.
  - esbuild
  # Playwright downloads its browser binaries in a postinstall step, so the
  # applier cannot install on a clean machine or a GitHub Actions runner without
  # this. Listed pre-emptively: the failure would otherwise appear only in CI,
  # which is the worst place to discover it.
  - playwright
  # The Chromium/Firefox/WebKit payloads are a separate package from the
  # Playwright client library and carry their own postinstall.
  - "@playwright/test"
# THE KEY THAT ACTUALLY DECIDES. pnpm 11 replaced pnpm 10's
# `onlyBuiltDependencies` list with this name->boolean map, and pnpm WROTE this
# block itself with the placeholder string "set this to true or false" while the
# list above already named esbuild -- which is the proof the list is inert in 11.
# An unanswered placeholder counts as "not yet decided", NOT as allowed, so the
# install kept failing. Values must be real booleans.
allowBuilds:
  # Selects the correct prebuilt platform binary. Arrives via vitest and vite,
  # not as anyone's direct dependency, which is why it breaks worker and
  # apps/web identically.
  esbuild: true
  # Downloads browser binaries. Pre-approved so a clean GitHub Actions runner
  # can install the applier; without it the failure appears first in CI.
  playwright: true
  # The browser payloads are a separate package from the client library and
  # carry their own postinstall.
  "@playwright/test": true
